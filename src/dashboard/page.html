<!-- One product name everywhere (Stage 29; Mark, 2026-09-29): Pick'em
     Model. The tab reads "<page> — Pick'em Model" on every page, this one
     included. tests/test_product_name.py holds it. -->
<title>Week Board — Pick'em Model</title>
<!-- The favicon (Stage 29): assets/favicon.svg, published at the site root's
     assets/ by src/site/build.py. The board lives at nfl/ since Stage 53, so
     the link climbs one folder; from a local checkout's root index.html the
     browser stops at the root, so the same link still finds assets/.
     tests/test_favicon.py holds the link, the file and the copy. -->
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<!-- The home-screen icon (Stage 34 item 31): iOS takes a PNG, not the SVG,
     and without one it uses a shrunken screenshot of the page. It is
     favicon.svg rendered at 180x180 on a full-bleed dark tile (iOS rounds
     the corners itself and fills transparent ones with black). To remake it,
     render assets/favicon.svg at that size in Chromium on #0B0D10. -->
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<!-- What a search result and a link preview show (Stage 13). The description
     is under 160 characters so a search result does not cut it off. The
     Open Graph image is static -- assets/og/og-card.png, made from
     assets/og/og-card.html -- and src/site/build.py copies it to the site
     root; og:image and og:url are absolute because link-preview crawlers do
     not resolve relative ones. og:url is the board's own address, nfl/, since
     Stage 53. tests/test_meta_and_og.py holds all of it. -->
<meta name="description" content="Weekly NFL picks from two models, one football-only and one with the Vegas spread, graded in public, with every experiment logged, failures included.">

     request to a font host; the licence travels in assets/fonts/OFL.txt.

     read "the stylesheet" as the first <style> element, and @font-face rules
     apply wherever they sit. -->

<body class="is-entering">
<script>
  // Applied before first paint so there's no visible flash of the wrong
  // theme on load. Falls back to the OS preference when the user hasn't
  // made an explicit choice yet.
  (function(){
    try{
      var saved = localStorage.getItem('nfl_pickem_theme');
      if(!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches){
        saved = 'light';
      }
      if(saved === 'light') document.documentElement.setAttribute('data-theme','light');
    }catch(e){}
  })();
</script>
