name: Deploy dashboard to Pages

# The site is BUILT here rather than served from a committed index.html.
#
# Why this exists. index.html is generated by src/generate_dashboard.py AND
# committed, and "Auto-regenerate dashboard" commits it again on every push to
# main. That means any open branch touching the template conflicts on a
# generated file the moment anything else merges. On 2026-09-10 that cost four
# rebase cycles on a single PR (#52). Those were not build-stamp churn --
# src/prune_build_churn.py already handles that case, and handled it correctly
# here; they were real regenerations from real data changes, which is exactly
# what the churn pruner is designed NOT to suppress.
#
# This workflow is phase 1 of the fix: build the site in CI and publish it as a
# Pages artifact. index.html stays committed for now, so the live site cannot
# break while the Pages source setting is switched over. Phase 2 untracks
# index.html and dist/, deletes the churn pruner, and drops the commit steps
# from the other workflows -- only after a deploy from here is confirmed live.
#
# The Pages source must be set to "GitHub Actions" in repo Settings -> Pages
# for this to serve anything. Until it is, this workflow builds and uploads
# successfully and the site continues to be served from the committed file.

on:
  push:
    branches: [main]
    # Same path set as Auto-regenerate: the inputs the dashboard is built from.
    # index.html is deliberately NOT watched -- phase 2 removes it, and watching
    # a file this workflow's sibling writes is how trigger loops start.
    paths:
      - 'src/**'
      - 'data/**'
      - 'predictions/**'
      - 'results/**'
      - '.github/workflows/deploy-pages.yml'

  # "Collect Booth's audit log" writes data/agent_log.json with the default
  # GITHUB_TOKEN, and GitHub will not let such a push trigger another workflow.
  # workflow_run crosses that gap. This is the same handoff Auto-regenerate
  # already documents; it is repeated here rather than shared because the two
  # workflows are meant to become one when phase 2 lands.
  workflow_run:
    workflows: ["Collect Booth's audit log"]
    types: [completed]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one midway: a cancelled deploy can
# leave the site on a half-published artifact. Queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # workflow_run fires on completion, not on success. A failed collector run
    # wrote no new data, so building on it just republishes the same site.
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the dashboard
        run: python src/generate_dashboard.py

      # The site is exactly three things: the page, the printable picks it links
      # to, and .nojekyll (without which Pages runs the output through Jekyll,
      # which strips files and directories beginning with an underscore).
      # Assembled into a clean directory rather than uploading the repo, so what
      # ships is only what the site needs -- no source, no tests, no data files.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp .nojekyll _site/
          if [ -d dist ]; then cp -r dist _site/; fi
          echo "--- what will be published ---"
          find _site -type f | sort

      # Fails the build rather than publishing a broken page. The placeholder
      # check is the one that matters: generate_dashboard.py fills __TOKENS__ in
      # the template, and a rename that silently stops filling one produces a
      # page that looks fine until you scroll to it.
      - name: Refuse to publish a page that did not build
        run: |
          test -s _site/index.html || { echo "index.html is missing or empty"; exit 1; }
          if grep -qE '__[A-Z0-9_]+__' _site/index.html; then
            echo "unfilled template placeholders remain:"
            grep -oE '__[A-Z0-9_]+__' _site/index.html | sort -u
            exit 1
          fi
          echo "index.html: $(wc -c < _site/index.html) bytes, no unfilled placeholders"

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
