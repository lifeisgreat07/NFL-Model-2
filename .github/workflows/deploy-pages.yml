name: Deploy dashboard to Pages

# The site is BUILT here rather than served from a committed index.html.
#
# Why this exists. index.html was generated by src/generate_dashboard.py AND
# committed, and a second workflow committed it again on every push to main.
# Any open branch touching the template therefore conflicted on a generated
# file the moment anything else merged -- five times in one day across three
# branches, four of them on PR #52 alone. Those were not build-stamp churn;
# they were real regenerations from real data changes.
#
# Phase 1 (PR #54) added this workflow: build the site in CI and publish it as
# a Pages artifact, with index.html still committed so the live site could not
# break while the Pages source setting was switched over.
#
# Phase 2 has now landed. index.html and dist/ are untracked, the churn pruner
# is deleted, "Auto-regenerate dashboard" is deleted -- its only job was to
# commit a file nobody commits any more -- and the weekly workflow commits data
# alone. This is the single workflow that builds the page, which is why the
# workflow_run handoff below lives here.
#
# This workflow is now the ONLY source of the published site. It holds
# `contents: read`, so it structurally cannot reintroduce the problem by
# committing what it builds.
#
# The Pages source is set to "GitHub Actions" in repo Settings -> Pages.
# Confirmed serving from here on 2026-09-10: a deploy stamped 18:33 while the
# committed file still said 18:26.

on:
  push:
    branches: [main]
    # The inputs the dashboard is built from. index.html is not watched
    # because it is no longer in the repository to watch; it is this
    # workflow's output.
    paths:
      - 'src/**'
      - 'data/**'
      - 'predictions/**'
      - 'results/**'
      # The self-hosted font (Stage 12) is inlined into the page at build
      # time, so a changed font file is a changed page.
      - 'assets/**'
      - '.github/workflows/deploy-pages.yml'

  # EVERY workflow that commits something in the paths above must also be
  # listed here, and the paths list alone is not enough for any of them: those
  # pushes are made with the default GITHUB_TOKEN, and GitHub will not let such
  # a push trigger another workflow. workflow_run crosses that gap.
  #
  # "Collect Booth's audit log" writes data/agent_log.json. That handoff was
  # severed once already -- the collector committed 44 audits and the live page
  # went on saying the record had not been collected.
  #
  # "Weekly update" writes predictions/**, results/** and data/** every
  # Tuesday, and was missing from this list until 2026-09-15. It graded the
  # first real week and locked in Week 2 at 11:05 UTC; the page went on serving
  # 04:30 UTC data, with no Week 2 in either week control, until someone
  # dispatched a build by hand. The same defect as the collector's, in a second
  # workflow, invisible because the guard named only the first one.
  #
  # "Weekend refresh" (Stage 15) writes data/game_status/** between the
  # Thursday lock and Tuesday's grading, with the same default GITHUB_TOKEN.
  #
  # Guarded by tests/test_generated_data_reaches_the_page.py, which now
  # enumerates the writers rather than listing them, so a third one is covered
  # without anyone remembering to come back here.
  workflow_run:
    workflows: ["Collect Booth's audit log", "Weekly update", "Weekend refresh"]
    types: [completed]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one midway: a cancelled deploy can
# leave the site on a half-published artifact. Queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # workflow_run fires on completion, not on success. A failed collector run
    # wrote no new data, so building on it just republishes the same site.
    # A failed Weekly update is different (Stage 24, from the 2026-09-28
    # audit): its grading and commit steps run under !cancelled(), so a run
    # that fails on purpose -- a week kicked off with nothing locked -- can
    # still commit last week's grades, and those must reach the page. The
    # build's own data check (src/check_build.py) still refuses a page with
    # missing data.
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'
      || (github.event.workflow_run.name == 'Weekly update'
          && github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the dashboard
        run: python src/generate_dashboard.py

      # A placeholder filled with NOTHING passes the placeholder check below:
      # Team Deep-Dive shipped empty for months that way, from a loader that
      # returned {} in silence. This reads every data payload out of the built
      # page and fails the build if one the page needs is missing or empty,
      # so the last good page stays published instead.
      - name: Check every page has its data
        run: python src/check_build.py index.html

      # The site is exactly five things: the page, the printable picks it links
      # to, its Open Graph image (Stage 13), its favicon (Stage 29), and
      # .nojekyll (without which Pages
      # runs the output through Jekyll,
      # which strips files and directories beginning with an underscore).
      # Assembled into a clean directory rather than uploading the repo, so what
      # ships is only what the site needs -- no source, no tests, no data files.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp .nojekyll _site/
          # The page's Open Graph image (Stage 13). og:image names it at the
          # site root, so it is copied there, not under assets/.
          cp assets/og/og-card.png _site/og-card.png
          # The favicon (Stage 29), at the path the page's <link rel="icon">
          # names, which is also where it sits in a checkout.
          mkdir -p _site/assets
          cp assets/favicon.svg _site/assets/favicon.svg
          # The home-screen icon (Stage 34 item 31), beside it.
          cp assets/apple-touch-icon.png _site/assets/apple-touch-icon.png
          if [ -d dist ]; then cp -r dist _site/; fi
          echo "--- what will be published ---"
          find _site -type f | sort

      # Fails the build rather than publishing a broken page. The placeholder
      # check is the one that matters: generate_dashboard.py fills __TOKENS__ in
      # the template, and a rename that silently stops filling one produces a
      # page that looks fine until you scroll to it.
      - name: Refuse to publish a page that did not build
        run: |
          test -s _site/index.html || { echo "index.html is missing or empty"; exit 1; }
          if grep -qE '__[A-Z0-9_]+__' _site/index.html; then
            echo "unfilled template placeholders remain:"
            grep -oE '__[A-Z0-9_]+__' _site/index.html | sort -u
            exit 1
          fi
          echo "index.html: $(wc -c < _site/index.html) bytes, no unfilled placeholders"

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
