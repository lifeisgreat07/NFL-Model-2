name: Deploy dashboard to Pages

# The site is BUILT here rather than served from a committed index.html.
#
# Why this exists. index.html was generated by src/generate_dashboard.py AND
# committed, and a second workflow committed it again on every push to main.
# Any open branch touching the template therefore conflicted on a generated
# file the moment anything else merged -- five times in one day across three
# branches, four of them on PR #52 alone. Those were not build-stamp churn;
# they were real regenerations from real data changes.
#
# Phase 1 (PR #54) added this workflow: build the site in CI and publish it as
# a Pages artifact, with index.html still committed so the live site could not
# break while the Pages source setting was switched over.
#
# Phase 2 has now landed. index.html and dist/ are untracked, the churn pruner
# is deleted, "Auto-regenerate dashboard" is deleted -- its only job was to
# commit a file nobody commits any more -- and the weekly workflow commits data
# alone. This is the single workflow that builds the page, which is why the
# workflow_run handoff below lives here.
#
# This workflow is now the ONLY source of the published site. It holds
# `contents: read`, so it structurally cannot reintroduce the problem by
# committing what it builds.
#
# The Pages source is set to "GitHub Actions" in repo Settings -> Pages.
# Confirmed serving from here on 2026-09-10: a deploy stamped 18:33 while the
# committed file still said 18:26.

on:
  push:
    branches: [main]
    # The inputs the dashboard is built from. index.html is not watched
    # because it is no longer in the repository to watch; it is this
    # workflow's output.
    paths:
      - 'src/**'
      - 'data/**'
      - 'predictions/**'
      - 'results/**'
      - '.github/workflows/deploy-pages.yml'

  # "Collect Booth's audit log" writes data/agent_log.json with the default
  # GITHUB_TOKEN, and GitHub will not let such a push trigger another workflow.
  # workflow_run crosses that gap. It was documented in two workflows until
  # phase 2; the two became one, as that note predicted, and this is the copy
  # that survived. Guarded by tests/test_generated_data_reaches_the_page.py,
  # which exists because this handoff was severed once already: the collector
  # committed 44 audits and the live page went on saying the record had not
  # been collected.
  workflow_run:
    workflows: ["Collect Booth's audit log"]
    types: [completed]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one midway: a cancelled deploy can
# leave the site on a half-published artifact. Queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # workflow_run fires on completion, not on success. A failed collector run
    # wrote no new data, so building on it just republishes the same site.
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the dashboard
        run: python src/generate_dashboard.py

      # The site is exactly three things: the page, the printable picks it links
      # to, and .nojekyll (without which Pages runs the output through Jekyll,
      # which strips files and directories beginning with an underscore).
      # Assembled into a clean directory rather than uploading the repo, so what
      # ships is only what the site needs -- no source, no tests, no data files.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp .nojekyll _site/
          if [ -d dist ]; then cp -r dist _site/; fi
          echo "--- what will be published ---"
          find _site -type f | sort

      # Fails the build rather than publishing a broken page. The placeholder
      # check is the one that matters: generate_dashboard.py fills __TOKENS__ in
      # the template, and a rename that silently stops filling one produces a
      # page that looks fine until you scroll to it.
      - name: Refuse to publish a page that did not build
        run: |
          test -s _site/index.html || { echo "index.html is missing or empty"; exit 1; }
          if grep -qE '__[A-Z0-9_]+__' _site/index.html; then
            echo "unfilled template placeholders remain:"
            grep -oE '__[A-Z0-9_]+__' _site/index.html | sort -u
            exit 1
          fi
          echo "index.html: $(wc -c < _site/index.html) bytes, no unfilled placeholders"

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
