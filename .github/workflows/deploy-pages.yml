name: Deploy dashboard to Pages

# The site is BUILT here rather than served from a committed index.html.
#
# Why this exists. index.html was generated by src/sports/nfl/generate_dashboard.py AND
# committed, and a second workflow committed it again on every push to main.
# Any open branch touching the template therefore conflicted on a generated
# file the moment anything else merged -- five times in one day across three
# branches, four of them on PR #52 alone. Those were not build-stamp churn;
# they were real regenerations from real data changes.
#
# Phase 1 (PR #54) added this workflow: build the site in CI and publish it as
# a Pages artifact, with index.html still committed so the live site could not
# break while the Pages source setting was switched over.
#
# Phase 2 has now landed. index.html and dist/ are untracked, the churn pruner
# is deleted, "Auto-regenerate dashboard" is deleted -- its only job was to
# commit a file nobody commits any more -- and the weekly workflow commits data
# alone. This is the single workflow that builds the page, which is why the
# workflow_run handoff below lives here.
#
# This workflow is now the ONLY source of the published site. It holds
# `contents: read`, so it structurally cannot reintroduce the problem by
# committing what it builds.
#
# The Pages source is set to "GitHub Actions" in repo Settings -> Pages.
# Confirmed serving from here on 2026-09-10: a deploy stamped 18:33 while the
# committed file still said 18:26.

on:
  push:
    branches: [main]
    # The inputs the site is built from. index.html is not watched
    # because it is no longer in the repository to watch; it is this
    # workflow's output. Whole folders, not the NFL's: the NHL and NBA
    # pages read results/, predictions/ and experiments/ too, and a fix
    # pushed by hand to one of those never redeployed (Stage 68 item 9,
    # the 2026-10-09 audit's E4). tests/test_deploy_paths.py holds it.
    paths:
      - 'src/**'
      - 'data/**'
      - 'predictions/**'
      - 'results/**'
      - 'experiments/**'
      # The self-hosted font (Stage 12) is inlined into the page at build
      # time, so a changed font file is a changed page.
      - 'assets/**'
      - '.github/workflows/deploy-pages.yml'

  # EVERY workflow that commits something in the paths above must also be
  # listed here, and the paths list alone is not enough for any of them: those
  # pushes are made with the default GITHUB_TOKEN, and GitHub will not let such
  # a push trigger another workflow. workflow_run crosses that gap.
  #
  # "Collect Booth's audit log" writes data/agent_log.json. That handoff was
  # severed once already -- the collector committed 44 audits and the live page
  # went on saying the record had not been collected.
  #
  # "NFL weekly update" writes predictions/nfl/**, results/nfl/** and data/nfl/** every
  # Tuesday, and was missing from this list until 2026-09-15. It graded the
  # first real week and locked in Week 2 at 11:05 UTC; the page went on serving
  # 04:30 UTC data, with no Week 2 in either week control, until someone
  # dispatched a build by hand. The same defect as the collector's, in a second
  # workflow, invisible because the guard named only the first one.
  #
  # "NFL weekend refresh" (Stage 15) writes data/nfl/game_status/** between the
  # Thursday lock and Tuesday's grading, with the same default GITHUB_TOKEN.
  #
  # "NHL daily run" writes data/nhl/**, predictions/nhl/** and results/nhl/**
  # twice a day; the NHL's page is built from them since Stage 53.
  #
  # "NBA daily run" (Stage 65) writes data/nba/**, predictions/nba/** and
  # results/nba/** twice a day from opening night, 2026-10-20.
  #
  # Guarded by tests/test_generated_data_reaches_the_page.py, which now
  # enumerates the writers rather than listing them, so a third one is covered
  # without anyone remembering to come back here.
  workflow_run:
    workflows: ["Collect Booth's audit log", "NFL weekly update", "NFL weekend refresh", "NHL daily run", "NBA daily run"]
    types: [completed]

  workflow_dispatch:

# Stage 82 item 7 (the 2026-11-02 review): each job holds only what it uses.
# The build job installs packages and processes scraped inputs, so it gets no
# Pages or OIDC scope; only the deploy job, which runs one pinned action, does.
permissions:
  contents: read

# One deploy at a time, and never cancel one midway: a cancelled deploy can
# leave the site on a half-published artifact. Queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      # To read the scheduled jobs' recent runs for the page (Stage 41 item 4).
      actions: read
      # To open an issue for a sport whose page did not build (Stage 53).
      issues: write
    # workflow_run fires on completion, not on success. A failed collector run
    # wrote no new data, so building on it just republishes the same site.
    # A failed Weekly update is different (Stage 24, from the 2026-09-28
    # audit): its grading and commit steps run under !cancelled(), so a run
    # that fails on purpose -- a week kicked off with nothing locked -- can
    # still commit last week's grades, and those must reach the page. The
    # build's own data check (src/sports/nfl/check_build.py) still refuses a page with
    # missing data.
    #
    # Stage 81 item 3 (the 2026-11-02 review) widened it to every writer but the
    # collector. The NHL and NBA daily runs and the Weekend refresh commit first
    # and run Line Judge after, as a later job that exits 1 on any finding; that
    # failure is the run's conclusion, so a success-only gate left their committed
    # picks and grades off the page until something else rebuilt it.
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'
      || (contains(fromJSON('["NFL weekly update","NFL weekend refresh","NHL daily run","NBA daily run"]'),
                   github.event.workflow_run.name)
          && github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The whole history: src/sports/nfl/lock_proof.py reads every commit
          # that changed a week's picks, and a shallow clone has none of them
          # (Stage 46 item 5).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The scheduled jobs' last runs, for Checking the AI's work (Stage 41
      # item 4): read from GitHub's Actions API into a gitignored file the
      # build reads. A failed read writes nothing and exits 0, so the site
      # still publishes and the page says the history was not read.
      - name: Read the scheduled jobs' recent runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m src.sports.nfl.recent_runs --repo "${{ github.repository }}" --out data/recent_runs.json

      # Every sport's page, each built in a process of its own
      # (src/site/build.py): the NFL's board (generate_dashboard, then
      # check_build's data check) at nfl/, the NHL's at nhl/, the NBA's at
      # nba/, and a root page that sends a visitor to nfl/ with any #picks=
      # link intact. A sport whose build fails keeps the page that is live now
      # and the others publish as usual; the step fails, and nothing is
      # published, only when the NFL has no page at all (Stage 53).
      - name: Build the site, one sport at a time
        run: python -m src.site.build --out _site --live-url "https://lifeisgreat07.github.io/NFL-Model-2" --report site-report.json

      # One issue per sport whose page did not build, titled for that sport,
      # so a broken NHL build never hides inside a green NFL deploy.
      - name: Open an issue for each sport whose page did not build
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python -m src.site.alert_failed site-report.json --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # Fails the build rather than publishing a broken page: every page in
      # the site must be non-empty and carry no unfilled __PLACEHOLDER__. The
      # builder checks its own pages too; this reads what will actually ship.
      - name: Refuse to publish a page that did not build
        run: |
          test -s _site/index.html || { echo "index.html is missing or empty"; exit 1; }
          test -s _site/nfl/index.html || { echo "nfl/index.html is missing or empty"; exit 1; }
          for page in $(find _site -name index.html | sort); do
            if grep -qE '__[A-Z0-9_]+__' "$page"; then
              echo "$page: unfilled template placeholders remain:"
              grep -oE '__[A-Z0-9_]+__' "$page" | sort -u
              exit 1
            fi
            echo "$page: $(wc -c < "$page") bytes, no unfilled placeholders"
          done
          echo "--- what will be published ---"
          find _site -type f | sort

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      # Stage 93 item 14 (audit 7 R13): a deploy that fails is unattended like
      # any scheduled job -- it runs on another workflow's data commit -- and
      # the live site silently stays on its last version. The deploy job
      # closes this issue when a later deploy succeeds.
      - name: Raise an alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf 'The site build failed, so nothing was published; the live site is the last one that was.\nRun: %s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > failure.md
          python -m src.core.alerts --title "Pages: the site was not published" --body-file failure.md

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
      # For the alert steps below (Stage 93 item 14): the checkout they need
      # and the issue they open or close.
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Check out repo, for the alert steps
        if: ${{ !cancelled() }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Raise an alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf 'The site built but did not deploy; the live site is the last one published.\nRun: %s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > failure.md
          python3 -m src.core.alerts --title "Pages: the site was not published" --body-file failure.md

      # Stage 83 item 1: a deploy that succeeds closes the failure issue, if
      # one is open. continue-on-error: closing an issue must never fail a run.
      - name: Close the alert if this run recovered
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf 'Recovered: the deploy at %s succeeded.\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > recovered.md
          python3 -m src.core.alerts --resolve --title "Pages: the site was not published" --body-file recovered.md
