name: Line Judge weekly digest
# Stage 44 item 5. Line Judge is silent when a run was right, and silence is
# also what a judge that stopped running looks like. Once a week this counts
# how last week's runs of the four judged workflows were judged (right, with
# findings, not judged) and comments the count on the standing issue "Line
# Judge weekly digest" (src/core/line_judge_digest.py, plain code; Mark,
# 2026-10-15). It reads the Actions API and writes nothing to the repository.
#
# Monday 08:23 UTC: after the Weekend refresh's last Monday slot (05:37) has
# finished, so the week it reports on is complete. GitHub's cron alone, not
# cron-job.org: a digest posted a few hours late costs nothing
# (missed_dispatch.NOT_DISPATCHED). tests/test_line_judge_digest.py holds this.

on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  digest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      # Stage 42 item 1: how late this run started, against its own cron lines.
      - name: Record the start delay
        timeout-minutes: 5
        run: python -m src.core.start_delay .github/workflows/line-judge-digest.yml
      - name: Install dependencies
        timeout-minutes: 5
        run: pip install -r requirements.txt
      - name: Post the digest
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: python -m src.core.line_judge_digest 2>&1 | tee digest.log
      # Stage 83 item 1: a run that succeeds closes the failure issue below, if
      # one is open. continue-on-error: closing an issue must never fail a run.
      - name: Close the alert if this run recovered
        timeout-minutes: 5
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf 'Recovered: the run at %s succeeded.\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > recovered.md
          python -m src.core.alerts --resolve --title "Line Judge weekly digest failing" --body-file recovered.md

      - name: Raise an alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf 'The Line Judge weekly digest could not be posted.\n\nRun: %s\n' \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > digest-report.md
          python -m src.core.alerts --title "Line Judge weekly digest failing" --body-file digest-report.md --log digest.log
