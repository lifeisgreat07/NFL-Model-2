name: Run tests
# Runs the leak-free test suite on every pull request and on every push to
# main, so "tests pass" is a structural gate (a required status check)
# rather than a claim a PR description can make without it being true.
# See VERIFICATION.md for the full reasoning.
#
# Stage 24 (the 2026-09-28 audit): until then this ran only on pull requests
# that touched src/** or tests/**. Documentation goes straight to main here,
# and many tests read the documentation and the workflow files -- a
# CLAUDE.md path that no longer exists, a README count, a workflow trigger --
# so those changes reached main with nothing running them. It also installed
# an unpinned pytest beside requirements-dev.txt's pinned one, and no node,
# so every test that runs template code in node skipped here.
# tests/test_run_tests_workflow.py holds each of those.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history, not the action's default fetch-depth of 1. Sixteen
          # tests in this suite read real git history -- branch state, what
          # changed against a base, how many non-merge commits a branch carries
          # -- and under a shallow checkout they skip. One of them did not skip,
          # it failed: tests/test_scout_preflight.py manufactures a scope
          # failure out of the last three non-merge commits, and with only one
          # commit available it manufactured nothing and asserted on the result.
          #
          # So this job was red on every pull request for days while
          # booth-pr-audit.yml ran the identical suite green on the identical
          # commit -- that workflow already sets fetch-depth: 0, for the same
          # reason. Two CI jobs disagreeing about the same commit is worse than
          # either being wrong, because it teaches you to ignore the red one.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Set up node
        # The template's functions are run in node by the tests that check
        # them; without node those tests skip rather than fail.
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.lock
      - name: Lint (pyflakes, import order, upgrades; see ruff.toml)
        # ruff.toml selects the F rules: undefined names, unused imports and
        # variables, empty f-strings -- mistakes, not style (Stage 27 item 3)
        # -- and I and UP, auto-fixed (Stage 32 item 18). No line lengths.
        run: ruff check .
      - name: Type check (the weekly run's two modules, the core, the site and the day sports)
        # Stage 68 item 25 (the 2026-10-09 audit's E18): src/core, src/site,
        # src/sports/nhl and src/sports/nba were clean when added, and had
        # never been checked.
        # Stage 35, from the third audit: build_team_ratings' one union
        # return type made every caller a type error, so nothing was
        # checked. With @overloads it is clean, and checking it found the
        # live ratings could be None with nothing stopping the writers
        # (weekly_update.current_ratings now does). Gating, since clean.
        # Stage 87 item 5: the NFL's two page builders join it.
        run: python -m mypy --ignore-missing-imports src/sports/nfl/weekly_update.py src/sports/nfl/ratings_engine.py src/sports/nfl/generate_dashboard.py src/sports/nfl/generate_picks_pdf.py
      - name: Type-check the core, the site and the day sports strictly
        # Stage 87 item 5 (the 2026-11-02 review): every function annotated,
        # nothing returning Any where it promises a type. Imports are followed,
        # so what these packages call (src/sports/nfl/paths.py) is held too.
        run: python -m mypy --strict --ignore-missing-imports src/core src/site src/sports/nhl src/sports/nba src/sports/mlb
      - name: Type-check the agents strictly
        # Stage 48 item 19: every function in src/agents annotated, checked
        # with --strict. --follow-imports=silent keeps it to src/agents: the
        # pipeline modules the agents import are not strict yet.
        run: python -m mypy --strict --ignore-missing-imports --follow-imports=silent src/agents
      - name: Run leak-free test suite
        run: python -m pytest tests/ -v
