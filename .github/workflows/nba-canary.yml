name: NBA nightly canary

# Stage 65: every source the NBA's daily run reads (src/sports/nba/canary.py),
# read once each night and judged on the shape the run needs. It writes
# nothing to the repository, so it cannot touch a pick.
#
# One issue per failing source, not one for the night: the registration
# names five outside reads (ESPN's scoreboard, box score, odds and injury
# report, and Kalshi), and a title that names the source lets one recover
# without hiding another. src/core/alerts.py opens "NBA: <source> failing in
# the nightly canary", or comments on it if it is already open; each title is
# written out once below, so a green night closes it (Stage 93 item 15). A canary that
# fails before naming any source opens "NBA: nightly canary failing".
#
# 06:50 UTC: after the night's last games have ended, and clear of the NFL's
# canary (06:00), the mutation slice (06:30) and the NHL's canary (06:40).
on:
  schedule:
    - cron: '50 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      # Stage 42 item 1: how late this run started, against its own cron lines.
      - name: Record the start delay
        timeout-minutes: 10
        run: python -m src.core.start_delay .github/workflows/nba-canary.yml

      # Stage 42 item 4: a run GitHub's cron started, for a slot cron-job.org
      # should have started, asks whether it did, and opens an issue if not.
      - name: Did cron-job.org start this slot?
        timeout-minutes: 10
        if: github.event_name == 'schedule'
        env:
          CRON_SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
        run: python -m src.core.missed_dispatch .github/workflows/nba-canary.yml

      - name: Install dependencies
        timeout-minutes: 10
        run: pip install --require-hashes -r requirements.lock

      - name: Run the canary
        timeout-minutes: 10
        run: python -m src.sports.nba.canary --report nba-canary-report.md --failed nba-canary-failed.txt

      # Stage 83 item 1: a run that succeeds closes the failure issue below, if
      # one is open. continue-on-error: closing an issue must never fail a run.
      - name: Close the alert if this run recovered
        timeout-minutes: 10
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf 'Recovered: the run at %s succeeded.\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > recovered.md
          python -m src.core.alerts --resolve --title "NBA: nightly canary failing" --body-file recovered.md
          python -m src.core.alerts --resolve --title "NBA: ESPN scoreboard failing in the nightly canary" --body-file recovered.md
          python -m src.core.alerts --resolve --title "NBA: ESPN box score failing in the nightly canary" --body-file recovered.md
          python -m src.core.alerts --resolve --title "NBA: ESPN odds failing in the nightly canary" --body-file recovered.md
          python -m src.core.alerts --resolve --title "NBA: ESPN injuries failing in the nightly canary" --body-file recovered.md
          python -m src.core.alerts --resolve --title "NBA: Kalshi failing in the nightly canary" --body-file recovered.md

      - name: Raise an alert per failing source
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ ! -s nba-canary-failed.txt ]; then
            printf 'The NBA canary failed before naming a source. See %s\n' "$run_url" > nba-canary-report.md
            python -m src.core.alerts --title "NBA: nightly canary failing" --body-file nba-canary-report.md
            exit 0
          fi
          printf '\nRun: %s\n' "$run_url" >> nba-canary-report.md
          # Stage 93 item 15: one fixed title per source, each closed by the step
          # above on the next green night (a templated title had no resolver, and
          # #543 stayed open after the canary recovered). A source the list below
          # does not name raises the night's own title, so a new check cannot
          # fail in silence.
          if grep -qx 'ESPN scoreboard' nba-canary-failed.txt; then
            python -m src.core.alerts --title "NBA: ESPN scoreboard failing in the nightly canary" --body-file nba-canary-report.md
          fi
          if grep -qx 'ESPN box score' nba-canary-failed.txt; then
            python -m src.core.alerts --title "NBA: ESPN box score failing in the nightly canary" --body-file nba-canary-report.md
          fi
          if grep -qx 'ESPN odds' nba-canary-failed.txt; then
            python -m src.core.alerts --title "NBA: ESPN odds failing in the nightly canary" --body-file nba-canary-report.md
          fi
          if grep -qx 'ESPN injuries' nba-canary-failed.txt; then
            python -m src.core.alerts --title "NBA: ESPN injuries failing in the nightly canary" --body-file nba-canary-report.md
          fi
          if grep -qx 'Kalshi' nba-canary-failed.txt; then
            python -m src.core.alerts --title "NBA: Kalshi failing in the nightly canary" --body-file nba-canary-report.md
          fi
          unknown=$(grep -vxF -e 'ESPN scoreboard' -e 'ESPN box score' -e 'ESPN odds' -e 'ESPN injuries' -e 'Kalshi' nba-canary-failed.txt | grep -v '^$' || true)
          if [ -n "$unknown" ]; then
            python -m src.core.alerts --title "NBA: nightly canary failing" --body-file nba-canary-report.md
          fi
