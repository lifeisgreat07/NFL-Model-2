name: Browser checks

# Stage 12. Drives Chromium over the BUILT dashboard -- every page, at 360,
# 390, 768, 1024, 1280 and 1440, with the network blocked and allowed -- and
# fails on sideways overflow, a Tab stop nobody can see, a control under
# 24px, a serious or critical axe-core finding, the self-hosted font not
# rendering, a page error, or a page over its byte budget. The rules and the
# reasons for each are in tests/browser/check_page.py.
#
# Its first run against the real page, before this workflow existed, found
# two defects that no other check could see: focus landing on a 1x1 hidden
# select (#118) and reliability points under 24px (#119). That is the case
# for running it on every change to what the page is built from.
#
# The checker proves itself first. --self-test runs every rule against a page
# built to break it and fails unless the rule reports it, so a rule that has
# quietly stopped being able to fail cannot go green here.
#
# No pixel-diff screenshots, deliberately (CLAUDE.md, Stage 12): they fail on
# font hinting and antialiasing, and a check that cries wolf gets ignored.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'assets/**'
      - 'data/nfl/**'
      - 'predictions/nfl/**'
      - 'results/nfl/**'
      - 'tests/browser/**'
      - 'requirements.txt'
      - '.github/workflows/browser-checks.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'tests/browser/**'
      - '.github/workflows/browser-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      # Versions pinned: the checker was written and proven against these,
      # and a browser that changes under it would change what "no findings"
      # means without anyone deciding it should.
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Set up Node (for axe-core only)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Fetch axe-core
        run: npm install --no-save --no-package-lock axe-core@4.13.0

      - name: Build the dashboard
        run: python -m src.sports.nfl.generate_dashboard

      - name: Prove every rule can fail
        run: python tests/browser/check_page.py --self-test --axe node_modules/axe-core/axe.min.js --tmp "$RUNNER_TEMP"

      - name: Check the built page
        run: python tests/browser/check_page.py index.html --axe node_modules/axe-core/axe.min.js

      # Stage 34 item 30: the states no real week is in yet -- a tied game, a
      # week recorded as skipped, a preview whose kickoff passed with no lock.
      # tests/browser/build_states.py builds them from the saved weeks with
      # the real generator, checks each page holds its state, and they are
      # then checked exactly like the real page. tests/test_states_pages.py
      # holds these two steps.
      - name: Build the states pages
        run: python tests/browser/build_states.py --out "$RUNNER_TEMP/states"

      - name: Check the states pages
        run: |
          for page in states_tie.html states_preview.html; do
            python tests/browser/check_page.py "$RUNNER_TEMP/states/$page" --axe node_modules/axe-core/axe.min.js
          done

      # Stage 53 item 4: the NHL's page, built by the real builder from a
      # sample week with every kind of card on it (tests/browser/build_nhl.py),
      # since the daily run's own files hold whatever state the season is in.
      - name: Build the NHL's page from a sample week
        run: python tests/browser/build_nhl.py --out "$RUNNER_TEMP/states/nhl.html"

      - name: Check the NHL's page
        run: python tests/browser/check_page.py "$RUNNER_TEMP/states/nhl.html" --axe node_modules/axe-core/axe.min.js

      # Stage 64: the NHL board shows one day, with each game's card folded
      # under its row, so most of it is reached only by clicking.
      # tests/browser/check_nhl_day.py presses every day and opens every row
      # at 390 and 1280 px in both themes; it proves itself first on copies
      # of the sample page with a defect written in.
      - name: Prove the NHL day board check can fail
        run: python tests/browser/check_nhl_day.py --self-test --tmp "$RUNNER_TEMP"

      - name: Check the NHL's day board
        run: python tests/browser/check_nhl_day.py "$RUNNER_TEMP/states/nhl.html"

      # Stage 61: the NBA's page, built by the real builder from the committed
      # backtest (src/sports/nba/site.py); it has no board and no daily files.
      - name: Build the NBA's page
        run: python -m src.sports.nba.site --out "$RUNNER_TEMP/states/nba.html"

      - name: Check the NBA's page
        run: python tests/browser/check_page.py "$RUNNER_TEMP/states/nba.html" --axe node_modules/axe-core/axe.min.js

      # Stage 77 item 32: the NBA board's eyebrow names the week it shows,
      # with the clock fixed on the 13th, opening night and the 27th.
      - name: Prove the NBA eyebrow check can fail
        run: python tests/browser/check_nba_eyebrow.py --self-test --tmp "$RUNNER_TEMP/eyebrow"

      - name: Check the NBA eyebrow names its week
        run: python tests/browser/check_nba_eyebrow.py "$RUNNER_TEMP/states/nba.html"

      # Stage 77 item 33: a weekday tip before 5 PM Eastern is ESPN's
      # placeholder and reads "time TBD" on the row and in the card.
      - name: Prove the NBA tip time check can fail
        run: python tests/browser/check_nba_tip.py --self-test --tmp "$RUNNER_TEMP/tip"

      - name: Check a placeholder tip time is not printed
        run: python tests/browser/check_nba_tip.py "$RUNNER_TEMP/states/nba.html"

      # Stage 80 item 60: until the first pick is saved, the NBA's note counts
      # down to it, with the clock fixed a week before, the day before, the
      # morning of and the day after opening night.
      - name: Prove the NBA countdown check can fail
        run: python tests/browser/check_nba_countdown.py --self-test --tmp "$RUNNER_TEMP/countdown"

      - name: Check the NBA counts down to its first picks
        run: python tests/browser/check_nba_countdown.py "$RUNNER_TEMP/states/nba.html"

      # Stage 79 item 48: a column beside the NBA's and the NHL's day boards at
      # 1280 px and wider, no taller than the window.
      - name: Prove the side column check can fail
        run: python tests/browser/check_side_column.py --self-test --tmp "$RUNNER_TEMP/side"

      - name: Check the column beside the day boards
        run: python tests/browser/check_side_column.py "$RUNNER_TEMP/states/nba.html" "$RUNNER_TEMP/states/nhl.html"

      # Stage 79 item 46: the NHL's Accuracy and the NBA's Checking the AI's
      # work draw the race, the trend and the calibration diagram.
      - name: Prove the accuracy check can fail
        run: python tests/browser/check_accuracy.py --self-test --tmp "$RUNNER_TEMP/accuracy"

      - name: Check the accuracy charts on the NHL and the NBA
        run: python tests/browser/check_accuracy.py "$RUNNER_TEMP/states/nhl.html" "$RUNNER_TEMP/states/nba.html"

      # Stage 68 item 5: no cell of a day-board row drawn over another, at
      # 320, 390 and 1280 px in both themes, with the clock before opening
      # night so every row carries its "Locks ..." label. It proves itself
      # first on a copy with the old fixed column written back.
      - name: Prove the row check can fail
        run: python tests/browser/check_rows.py --self-test --tmp "$RUNNER_TEMP"

      - name: Check the NBA's rows
        run: python tests/browser/check_rows.py "$RUNNER_TEMP/states/nba.html"

      # Stage 75 item 1 (the 2026-10-13 UI/UX audit): a card's lead marker sits
      # on its bar's split, within 1 px, on every NFL and NHL card at 390 and
      # 1440 px in both themes. The NBA has no card until opening night;
      # tests/test_card_axis.py holds its source. Proves itself first on a
      # copy with the old marker position written back.
      - name: Prove the card axis check can fail
        run: python tests/browser/check_card_axis.py --self-test --tmp "$RUNNER_TEMP/axis"

      - name: Check the cards' axis
        run: python tests/browser/check_card_axis.py index.html "$RUNNER_TEMP/states/nhl.html"

      # Stage 75 item 2: a day-board row and its card print the same pick,
      # "TOR 51% · even" in both inside EVEN_BAND, on every NHL row with a pick
      # at 390 and 1440 px in both themes. tests/test_row_card_agree.py holds
      # the NBA's source until it has picks.
      - name: Prove the row-and-card check can fail
        run: python tests/browser/check_row_card.py --self-test --tmp "$RUNNER_TEMP/rowcard"

      - name: Check each row agrees with its card
        run: python tests/browser/check_row_card.py "$RUNNER_TEMP/states/nhl.html"

      # Stage 75 item 3: a tapped row's card is scrolled on screen, clear of
      # the sticky top bar and the fixed bottom nav, at 390x844 and 1440x900
      # in both themes; the NFL phone card does not repeat the row's header.
      - name: Prove the card reveal check can fail
        run: python tests/browser/check_card_reveal.py --self-test --tmp "$RUNNER_TEMP/reveal"

      - name: Check an opened card is on screen
        run: python tests/browser/check_card_reveal.py index.html "$RUNNER_TEMP/states/nhl.html"

      # Stage 75 item 4: rows the reader opened stay open through the theme
      # toggle and a day chip and back, at 390 and 1440 px in both themes.
      - name: Prove the open rows check can fail
        run: python tests/browser/check_open_rows.py --self-test --tmp "$RUNNER_TEMP/openrows"

      - name: Check open rows stay open
        run: python tests/browser/check_open_rows.py "$RUNNER_TEMP/states/nhl.html"

      # Stage 76 item 7: a day and a club have an address (#board/<day>,
      # #team/<club>), written by a chip, a week step and the club select.
      - name: Prove the routes check can fail
        run: python tests/browser/check_routes.py --self-test --tmp "$RUNNER_TEMP/routes"

      - name: Check a day and a club have an address
        run: python tests/browser/check_routes.py "$RUNNER_TEMP/states/nhl.html"

      # Stage 76 item 9: #game/<id> opens the game's week or day with its card
      # open and on screen, on the NFL page and the NHL's sample page.
      - name: Prove the game route check can fail
        run: python tests/browser/check_game_route.py --self-test --tmp "$RUNNER_TEMP/gameroute"

      - name: Check a game's address opens it
        run: python tests/browser/check_game_route.py index.html "$RUNNER_TEMP/states/nhl.html"

      # Stage 76 item 10: a link focuses the page's heading as a tap does, the
      # heading wears no ring, and Back and Forward keep each page's scroll.
      - name: Prove the page return check can fail
        run: python tests/browser/check_page_return.py --self-test --tmp "$RUNNER_TEMP/pagereturn"

      - name: Check arriving on a page and coming back to one
        run: python tests/browser/check_page_return.py index.html "$RUNNER_TEMP/states/nhl.html"

      # Stage 59: the site's home page, built by the real builder from the
      # committed files (src/site/home.py).
      - name: Build the home page
        run: python -m src.site.home --out "$RUNNER_TEMP/states/home.html"

      - name: Check the home page
        run: python tests/browser/check_page.py "$RUNNER_TEMP/states/home.html" --axe node_modules/axe-core/axe.min.js

      # Stage 62 items 1 and 4: the light/dark choice is the site's, so it
      # must follow the visitor from page to page. Only a browser walking the
      # built site on one origin can see that (tests/browser/check_theme.py);
      # it proves it can fail first, on pages that keep their own keys.
      - name: Prove the theme check can fail
        run: python tests/browser/check_theme.py --self-test --tmp "$RUNNER_TEMP"

      - name: Build the whole site
        run: python -m src.site.build --out "$RUNNER_TEMP/site"

      - name: Check the theme follows the visitor between pages
        run: python tests/browser/check_theme.py "$RUNNER_TEMP/site"
