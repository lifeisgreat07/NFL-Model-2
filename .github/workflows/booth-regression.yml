name: Booth regression fixture

# Runs ONE Booth regression fixture and records what Booth said about it.
#
# Manual dispatch only, deliberately. Booth authenticates with the
# subscription rather than a metered API key, so a run costs no money -- but it
# does cost usage, and usage is the real constraint here. The whole design of
# tests/booth_fixtures exists so that asking the expensive question is rare and
# re-checking the answer is free: src/booth_fixture_runner.py's `check`, and
# tests/test_booth_fixture_runner.py, re-verify every recorded baseline on
# every ordinary suite run at no cost. Never dispatch this to learn something a
# committed baseline already records.
#
# One fixture per dispatch, for the same reason. There is no "all".
#
# TWO JOBS ON PURPOSE. The audit job runs with `contents: read`, so Booth
# structurally cannot write to the repository even if instructed to -- the same
# property booth-pr-audit.yml protects, and for the same reason. Recording the
# baseline needs write access, so it happens in a separate job that never runs
# a model. A single job with write permission would hand Booth the ability to
# commit its own verdict.

on:
  workflow_dispatch:
    inputs:
      fixture:
        description: 'Fixture id (a directory under tests/booth_fixtures/)'
        required: true
        default: 'fixed-everywhere'
        type: string
      record_baseline:
        description: 'Commit the result as the fixture baseline'
        required: false
        default: true
        type: boolean

concurrency:
  group: booth-regression-${{ inputs.fixture }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      head: ${{ steps.assemble.outputs.head }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        # Booth cannot verify "the tests pass" without being able to run them,
        # and the fixture's own suite is one of the things it checks.
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Assemble the fixture into a throwaway repository
        id: assemble
        run: |
          set -euo pipefail
          python src/booth_fixture_runner.py assemble "${{ inputs.fixture }}" \
            --out .fixture-run/ci
          echo "head=$(git -C .fixture-run/ci rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Render the prompt
        id: prompt
        # Generated by the runner, never restated here. booth-pr-audit.yml
        # makes the same choice about the protocol -- "one source of truth" --
        # and a prompt copied into YAML drifts from the module exactly the way
        # that comment warns about.
        run: |
          set -euo pipefail
          python src/booth_fixture_runner.py prompt "${{ inputs.fixture }}" \
            --out .fixture-run/ci > prompt.txt
          {
            echo 'text<<PROMPT_EOF'
            cat prompt.txt
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Booth against the fixture
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            ${{ steps.prompt.outputs.text }}

            Write your complete report to booth-report.md in the workspace
            root -- NOT inside .fixture-run/ci, which is a throwaway checkout
            that is not preserved.
          claude_args: |
            --max-turns 120
            --allowedTools "Bash,Read,Glob,Grep,Write"

      - name: Fail loudly if no report was written
        # A missing report and a clean audit look identical to a later reader
        # otherwise, which is the ambiguity this project has been bitten by
        # twice: a skipped workflow reports success.
        run: |
          test -s booth-report.md || {
            echo "Booth produced no report. This is not a passing fixture --"
            echo "it is a run that did not happen."
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: booth-report-${{ inputs.fixture }}
          path: booth-report.md
          retention-days: 30

  record:
    needs: audit
    if: ${{ inputs.record_baseline }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - uses: actions/download-artifact@v4
        with:
          name: booth-report-${{ inputs.fixture }}

      - name: Record the baseline
        # `record` exits non-zero when the fixture is NOT satisfied -- Booth
        # missed the seeded defect. That is a real finding and must still be
        # committed, so the failure is captured rather than aborting the job.
        # A missed fixture that never reaches the repository is invisible until
        # someone spends another audit rediscovering it. The final step below
        # re-reads record.log and fails the run, after the commit.
        continue-on-error: true
        run: |
          python src/booth_fixture_runner.py record "${{ inputs.fixture }}" \
            --report booth-report.md --out .fixture-run/ci | tee record.log
          # Deliberately NOT capturing $? here: after a pipe it is tee's exit
          # status, not the runner's, so it would always be 0 -- a value that
          # looks like a signal and never was one. record.log is the signal.

      - name: Commit the baseline
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "tests/booth_fixtures/${{ inputs.fixture }}/baseline.json"
          if git diff --cached --quiet; then
            echo "baseline unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "Record Booth baseline for fixture ${{ inputs.fixture }}

          $(cat record.log)

          Recorded by .github/workflows/booth-regression.yml. The baseline is
          re-checked free on every suite run by check_one(), which re-derives
          the answer from the stored verdict rather than trusting this run."
          git push

      - name: Report the outcome
        run: |
          cat record.log >> "$GITHUB_STEP_SUMMARY"
          grep -q '^SATISFIED' record.log || {
            echo "Booth did NOT catch the seeded defect in ${{ inputs.fixture }}."
            echo "The baseline is committed so the miss is on the record."
            exit 1
          }
