name: NHL data probe

# Stage 51 item 1. docs/nhl-data.md was written from reads on the local
# machine, and a home connection is not a runner: ESPN's scoreboard answers
# GitHub's runners with HTTP 403 (#131). So src/sports/nhl/data_probe.py reads
# every source the NHL's go/no-go relies on -- the league's schedule,
# play-by-play, box score and live odds, ESPN's odds for a past game, the
# SportsDataverse fallback and Daily Faceoff's starting goalies -- prints what
# each returned, writes nothing, and exits non-zero if any source is
# unreachable or the wrong shape.
#
# It runs on pull requests that touch it, so its answer is on the PR's own
# checks, and by hand. It is not scheduled: the NHL's canary (Stage 55) is
# where a source that later breaks will be watched.

on:
  pull_request:
    paths:
      - 'src/sports/nhl/data_probe.py'
      - '.github/workflows/nhl-data-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Read every NHL source from GitHub's runner
        run: python -m src.sports.nhl.data_probe
