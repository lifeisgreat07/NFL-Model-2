name: Nightly dependency audit
# Stage 45 item 3. pip-audit checks requirements.txt (and what it pulls in)
# against the known-vulnerability databases once a night. Report-only: it
# never fails a pull request and changes no install anywhere, because the
# pins in requirements.txt are what make the published numbers reproducible
# (see that file's header) and moving one is a decision, not a fix a bot
# makes. A finding goes to the run's summary and opens the issue
# "Dependency audit found known vulnerabilities" through
# src/core/alerts.py (standard library only, so nothing else is installed), or comments on it -- the one-issue-per-problem rule
# every unattended job follows since Stage 4. An audit that could not run
# (a network or resolver error) says so under its own title. It writes
# nothing to the repository. 07:45 UTC: after the shuffled suite (07:15).
# tests/test_dependency_audit.py holds each of these.

on:
  schedule:
    - cron: '45 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      # Stage 42 item 1: how late this run started, against its own cron lines.
      - name: Record the start delay
        timeout-minutes: 10
        run: python -m src.core.start_delay .github/workflows/nightly-dependency-audit.yml

      # Stage 42 item 4: a run GitHub's cron started, for a slot cron-job.org
      # should have started, asks whether it did, and opens an issue if not.
      - name: Did cron-job.org start this slot?
        timeout-minutes: 10
        if: github.event_name == 'schedule'
        env:
          CRON_SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
        run: python -m src.core.missed_dispatch .github/workflows/nightly-dependency-audit.yml
      - name: Install pip-audit
        timeout-minutes: 10
        # Installed here only, pinned, and not in requirements-dev.txt.
        run: pip install pip-audit==2.10.1
      - name: Audit requirements.txt
        timeout-minutes: 10
        id: audit
        # pip-audit exits 1 when it finds a vulnerability and with another
        # code when it cannot run; neither fails this step (report-only).
        run: |
          set +e
          # Both files (Stage 68 item 14): the test harness Booth verifies
          # with is pinned in requirements-dev.txt and runs on every PR.
          # Stage 88 item 3: read from requirements-dev.lock, the hashed lock of
          # both that every workflow installs, so the audit is of what runs,
          # transitive packages included, with no resolution of its own.
          # Stage 83 item 2: vulnerabilities a person accepted, until their review date.
          ignore=$(python -m src.core.accepted_vulns .github/accepted-vulnerabilities.json)
          pip-audit -r requirements-dev.lock --require-hashes --disable-pip --progress-spinner off --desc on -f markdown -o audit.md $ignore
          code=$?
          set -e
          # pip-audit writes no report at all on a clean night (2.10.1, checked
          # 2026-10-09), and reading a missing report back failed this step
          # under set -e: the clean night after #364 opened "could not run" (#365).
          if [ ! -f audit.md ]; then
            if [ "$code" = "0" ]; then
              echo "No known vulnerabilities found." > audit.md
            else
              echo "pip-audit wrote no report." > audit.md
            fi
          fi
          { echo "## pip-audit of requirements.txt (exit $code)"; cat audit.md; } >> "$GITHUB_STEP_SUMMARY"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Raise an alert
        timeout-minutes: 10
        if: ${{ steps.audit.outputs.code != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CODE: ${{ steps.audit.outputs.code }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$CODE" = "1" ]; then
            title="Dependency audit found known vulnerabilities"
            { printf 'pip-audit found known vulnerabilities in requirements.txt or what it pulls in. Nothing was changed: moving a pin is a decision (see the header of requirements.txt).\n\nRun: %s\n\n' "$run_url"; cat audit.md; } > audit-report.md
          else
            title="Dependency audit could not run"
            printf 'pip-audit exited %s, so tonight'"'"'s audit says nothing either way.\n\nRun: %s\n' "$CODE" "$run_url" > audit-report.md
          fi
          python -m src.core.alerts --title "$title" --body-file audit-report.md
      # Stage 83 item 1: a run that succeeds closes the failure issue below, if
      # one is open. continue-on-error: closing an issue must never fail a run.
      - name: Close the alert if this run recovered
        timeout-minutes: 10
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf 'Recovered: the run at %s succeeded.\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > recovered.md
          python -m src.core.alerts --resolve --title "Dependency audit could not run" --body-file recovered.md

      - name: Raise an alert if the job itself failed
        # pip-audit's own result never fails the job; this is for the job
        # failing around it (checkout, Python, the install).
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf 'The nightly dependency audit job failed before it could report.\n\nRun: %s\n' \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > job-report.md
          python -m src.core.alerts --title "Dependency audit could not run" --body-file job-report.md
