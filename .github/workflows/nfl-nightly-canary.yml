name: NFL nightly canary

# Runs the weekly job's data path every night, so an upstream break shows up
# the day it happens instead of on the next locking run. The case it exists
# for: in the 2026 offseason nflreadpy started rejecting play-by-play for a
# season it did not consider current, and the weekly run crashed on it (#6).
#
# src/sports/nfl/canary.py loads what the weekly run loads, runs the data-quality checks
# and compares nflverse's columns with data/nfl/nflverse_schema.json. It writes
# nothing to the repository: no predictions, no grades, no commit. So it
# cannot touch a lock.
#
# On a failure, src/core/alerts.py opens the issue "NFL: Nightly canary failing", or
# comments on it if it is already open. One issue for a run of bad nights,
# not one a night; closing it says "handled".
#
# 06:00 UTC: after nflverse's nightly rebuild, and five hours before the
# weekly runs at 11:00 Tuesday and Thursday. Started late, it can overlap
# them; it only reads, so that costs nothing.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      # Stage 42 item 1: how late this run started, against its own cron lines.
      - name: Record the start delay
        run: python -m src.core.start_delay .github/workflows/nfl-nightly-canary.yml

      # Stage 42 item 4: a run GitHub's cron started, for a slot cron-job.org
      # should have started, asks whether it did, and opens an issue if not.
      - name: Did cron-job.org start this slot?
        if: github.event_name == 'schedule'
        env:
          CRON_SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
        run: python -m src.core.missed_dispatch .github/workflows/nfl-nightly-canary.yml

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.lock

      # Finished seasons of play-by-play, kept between nights. The key rolls
      # over each month, because nflverse does occasionally correct an old
      # season. The current season is never cached (src/sports/nfl/data_loader.py).
      # The weekly run does not use this cache on purpose: the run that makes
      # picks always fetches fresh.
      - name: Month key for the play-by-play cache
        id: month
        run: echo "key=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .pbp-cache
          key: pbp-${{ steps.month.outputs.key }}

      - name: Run the canary
        env:
          NFL_PBP_CACHE: .pbp-cache
        run: python -m src.sports.nfl.canary --report canary-report.md

      # Stage 83 item 1: a run that succeeds closes the failure issue below, if
      # one is open. continue-on-error: closing an issue must never fail a run.
      - name: Close the alert if this run recovered
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf 'Recovered: the run at %s succeeded.\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > recovered.md
          python -m src.core.alerts --resolve --title "NFL: Nightly canary failing" --body-file recovered.md

      - name: Raise an alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A canary that crashed before writing its report still gets an
          # alert: the step above failing is the finding.
          if [ ! -s canary-report.md ]; then
            printf 'The canary failed before writing a report. See %s\n' \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > canary-report.md
          else
            printf '\nRun: %s\n' \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> canary-report.md
          fi
          python -m src.core.alerts --title "NFL: Nightly canary failing" --body-file canary-report.md
