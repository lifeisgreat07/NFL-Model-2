name: Nightly mutation slice
# Stage 27 item 2, from the 2026-09-28 audit. The mutation corpus is run by
# hand, case file by case file, only for what a PR touches. A guard that a
# later change quietly weakened, in a file that PR did not touch, stays
# "caught" in the last table that mentioned it and is never run again.
#
# So every night a slice of the whole corpus runs: 30 cases, chosen by a
# seed that is the UTC date (YYYYMMDD). Each night's draw is independent, so
# a given case comes up on average once every (corpus size / 30) nights --
# no count here, because the corpus grows with every PR and a number in this
# comment was stale within a day (Stage 30 item 7). Some cases come up much
# later; this is a sampler, not a rotation through the corpus.
# Any one night is reproducible by hand with the seed from its run summary:
#   python tests/mutation/runner.py --sample 30 --seed <seed>
# The counts by status go into the run summary. Anything but CAUGHT fails
# the job, and a failed job opens the issue "Nightly mutation slice failing"
# through src/alerts.py, or comments on it if it is already open -- the same
# one-issue-per-problem rule as every other unattended job since Stage 4.
# Until Stage 30 item 7 a failure was only a red run and an email.
#
# It writes nothing to the repository. 06:30 UTC: after the canary at 06:00,
# and before the weekly runs at 11:00 Tuesday and Thursday. Started late it
# can overlap them; it only reads, so that costs nothing.
# tests/test_nightly_mutation.py holds each of these.

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  slice:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The same full history run-tests.yml fetches: some guards read
          # git history, and under a shallow clone they skip or misfire.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Set up node
        # Guards that run template code in node skip without it, and a
        # skipped guard lets its mutation survive.
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tonight's slice
        run: |
          seed="$(date -u +%Y%m%d)"
          python tests/mutation/runner.py --sample 30 --seed "$seed" --summary "$GITHUB_STEP_SUMMARY"
      - name: Raise an alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The table of statuses is in the run summary; the issue says where
          # it is and how to replay the night. A failure before the slice ran
          # (a broken install) gets the same issue: the job failing is the
          # finding.
          printf 'The nightly mutation slice failed (seed %s).\n\nRun: %s\n\nReplay: python tests/mutation/runner.py --sample 30 --seed %s\n' \
            "$(date -u +%Y%m%d)" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$(date -u +%Y%m%d)" > slice-report.md
          python src/alerts.py --title "Nightly mutation slice failing" --body-file slice-report.md
