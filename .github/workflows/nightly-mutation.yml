name: Nightly mutation slice
# Stage 27 item 2, from the 2026-09-28 audit. The mutation corpus is run by
# hand, case file by case file, only for what a PR touches. A guard that a
# later change quietly weakened, in a file that PR did not touch, stays
# "caught" in the last table that mentioned it and is never run again.
#
# So every night a slice of the whole corpus runs: 30 cases, chosen by a
# seed that is the UTC date (YYYYMMDD). Each night's draw is independent, so
# a given case comes up on average once every (corpus size / 30) nights --
# no count here, because the corpus grows with every PR and a number in this
# comment was stale within a day (Stage 30 item 7). Some cases come up much
# later; this is a sampler, not a rotation through the corpus.
# Stage 96 item 50 (audit 7, T6): beside it, a rotation. Every Python case
# under src/core and src/sports comes up once in any 28 nights in a row
# (`--rotate`, tests/mutation/runner.py's rotation_cases), about a 28th
# of them a night, so no guard of the model's code waits months to be run.
# Any one night is reproducible by hand with the seed from its run summary:
#   python tests/mutation/runner.py --sample 30 --rotate --seed <seed>
# The counts by status go into the run summary. Anything but CAUGHT fails
# the job, and a failed job opens the issue "Nightly mutation slice failing"
# through src/core/alerts.py, or comments on it if it is already open -- the same
# one-issue-per-problem rule as every other unattended job since Stage 4.
# Until Stage 30 item 7 a failure was only a red run and an email.
#
# It writes nothing to the repository. 06:30 UTC: after the canary at 06:00,
# and before the weekly runs at 11:00 Tuesday and Thursday. Started late it
# can overlap them; it only reads, so that costs nothing.
# tests/test_nightly_mutation.py holds each of these.

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  slice:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The same full history run-tests.yml fetches: some guards read
          # git history, and under a shallow clone they skip or misfire.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: pip

      # Stage 42 item 1: how late this run started, against its own cron lines.
      - name: Record the start delay
        timeout-minutes: 40
        run: python -m src.core.start_delay .github/workflows/nightly-mutation.yml

      # Stage 42 item 4: a run GitHub's cron started, for a slot cron-job.org
      # should have started, asks whether it did, and opens an issue if not.
      - name: Did cron-job.org start this slot?
        timeout-minutes: 40
        if: github.event_name == 'schedule'
        env:
          CRON_SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
        run: python -m src.core.missed_dispatch .github/workflows/nightly-mutation.yml
      - name: Set up node
        # Guards that run template code in node skip without it, and a
        # skipped guard lets its mutation survive.
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
      - name: Install dependencies
        timeout-minutes: 40
        run: pip install --require-hashes -r requirements-dev.lock
      - name: Run tonight's slice
        timeout-minutes: 40
        shell: bash
        run: |
          seed="$(date -u +%Y%m%d)"
          python tests/mutation/runner.py --sample 30 --rotate --seed "$seed" --summary "$GITHUB_STEP_SUMMARY" 2>&1 | tee slice.log
      # Stage 83 item 1: a run that succeeds closes the failure issue below, if
      # one is open. continue-on-error: closing an issue must never fail a run.
      - name: Close the alert if this run recovered
        timeout-minutes: 40
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf 'Recovered: the run at %s succeeded.\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > recovered.md
          python -m src.core.alerts --resolve --title "Nightly mutation slice failing" --body-file recovered.md

      - name: Raise an alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The table of statuses is in the run summary; the issue says where
          # it is and how to replay the night. A failure before the slice ran
          # (a broken install) gets the same issue: the job failing is the
          # finding.
          printf 'The nightly mutation slice failed (seed %s).\n\nRun: %s\n\nReplay: python tests/mutation/runner.py --sample 30 --rotate --seed %s\n' \
            "$(date -u +%Y%m%d)" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$(date -u +%Y%m%d)" > slice-report.md
          python -m src.core.alerts --title "Nightly mutation slice failing" --body-file slice-report.md --log slice.log
