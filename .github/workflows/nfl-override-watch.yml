name: NFL QB override watch

# Stage 81 item 1. A QB override file only counts once it is on main, and the
# Weekly update locks the week on Thursday at 11:00 UTC. The QB routine opens
# its pull request on Wednesday at 22:00 UTC; in weeks 7 and 8 of 2026 that
# pull request was still open at the lock and the picks used a starter who was
# out for the season. This opens an issue the moment such a pull request
# appears, and closes it when the pull request is merged or closed
# (src/sports/nfl/override_watch.py).
#
# It runs on the pull request's own events, not on a timer: GitHub's cron
# starts hours late, and Wednesday night is the time that matters.
#
# The code that runs is the BASE commit's, never the pull request's: a pull
# request cannot rewrite the watch that reports on it, and nothing from the
# pull request runs with this job's `issues: write`. The file list comes from
# the API, not from a checkout of the head.

on:
  pull_request:
    types: [opened, reopened, closed]
    paths:
      - 'data/nfl/qb_overrides/**'

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  watch:
    # A fork's pull request gets a read-only token; there is nothing to do.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Open or close the week's issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event.action }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ github.event.pull_request.html_url }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json files --jq '.files[].path' > "$RUNNER_TEMP/files.txt"
          python3 -m src.sports.nfl.override_watch --event "$EVENT" --pr "$PR" --url "$URL" \
            --merged "$MERGED" --files-file "$RUNNER_TEMP/files.txt"

      # Stage 93 item 14 (audit 7 R13): the watch is what tells Mark an override
      # is waiting before the lock; if it fails, that issue is never opened and
      # nothing says so.
      - name: Raise an alert
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          URL: ${{ github.event.pull_request.html_url }}
        run: |
          printf 'The QB override watch failed on %s, so its issue may not have been opened or closed. Check the pull request before the lock.\nRun: %s\n' "$URL" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > failure.md
          python3 -m src.core.alerts --title "NFL: QB override watch failed" --body-file failure.md

      # Stage 83 item 1: a watch that succeeds closes the failure issue, if one
      # is open. continue-on-error: closing an issue must never fail a run.
      - name: Close the alert if this run recovered
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf 'Recovered: the watch at %s succeeded.\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > recovered.md
          python3 -m src.core.alerts --resolve --title "NFL: QB override watch failed" --body-file recovered.md
