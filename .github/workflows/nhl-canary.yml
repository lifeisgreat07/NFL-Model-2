name: NHL nightly canary

# Stage 58: every read the NHL's daily run makes (src/sports/nhl/canary.py),
# run each night and judged on the shape the run needs. It writes nothing to
# the repository, so it cannot touch a pick.
#
# 06:40 UTC: after the night's last games have ended, and clear of the NFL's
# canary (06:00) and the nightly mutation slice (06:30).
#
# On a failure, src/core/alerts.py opens the issue "NHL: nightly canary
# failing", or comments on it if it is already open.
on:
  schedule:
    - cron: '40 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the canary
        run: python -m src.sports.nhl.canary --report nhl-canary-report.md

      - name: Raise an alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ ! -s nhl-canary-report.md ]; then
            printf 'The NHL canary failed before writing a report. See %s\n' \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > nhl-canary-report.md
          else
            printf '\nRun: %s\n' \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> nhl-canary-report.md
          fi
          python -m src.core.alerts --title "NHL: nightly canary failing" --body-file nhl-canary-report.md
