name: NHL nightly canary

# Stage 58: every read the NHL's daily run makes (src/sports/nhl/canary.py),
# run each night and judged on the shape the run needs. It writes nothing to
# the repository, so it cannot touch a pick.
#
# 06:40 UTC: after the night's last games have ended, and clear of the NFL's
# canary (06:00) and the nightly mutation slice (06:30).
#
# On a failure, src/core/alerts.py opens the issue "NHL: nightly canary
# failing", or comments on it if it is already open.
on:
  schedule:
    - cron: '40 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      # Stage 42 item 1: how late this run started, against its own cron lines.
      - name: Record the start delay
        timeout-minutes: 10
        run: python -m src.core.start_delay .github/workflows/nhl-canary.yml

      # Stage 42 item 4: a run GitHub's cron started, for a slot cron-job.org
      # should have started, asks whether it did, and opens an issue if not.
      - name: Did cron-job.org start this slot?
        timeout-minutes: 10
        if: github.event_name == 'schedule'
        env:
          CRON_SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
        run: python -m src.core.missed_dispatch .github/workflows/nhl-canary.yml

      - name: Install dependencies
        timeout-minutes: 10
        run: pip install --require-hashes -r requirements.lock

      - name: Run the canary
        timeout-minutes: 10
        run: python -m src.sports.nhl.canary --report nhl-canary-report.md

      # Stage 83 item 1: a run that succeeds closes the failure issue below, if
      # one is open. continue-on-error: closing an issue must never fail a run.
      - name: Close the alert if this run recovered
        timeout-minutes: 10
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf 'Recovered: the run at %s succeeded.\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > recovered.md
          python -m src.core.alerts --resolve --title "NHL: nightly canary failing" --body-file recovered.md

      - name: Raise an alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ ! -s nhl-canary-report.md ]; then
            printf 'The NHL canary failed before writing a report. See %s\n' \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > nhl-canary-report.md
          else
            printf '\nRun: %s\n' \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> nhl-canary-report.md
          fi
          python -m src.core.alerts --title "NHL: nightly canary failing" --body-file nhl-canary-report.md
