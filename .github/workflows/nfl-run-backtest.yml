name: NFL run backtest / tuning

# On-demand heavy model runs. These are the scripts that need real nflverse
# data (nflreadpy, pyarrow) and six seasons of play-by-play, which is why
# they can't run in a Cowork sandbox -- that environment has no PyPI access,
# so nflreadpy/pyarrow can't even be installed there. A GitHub runner has
# both, so this workflow is where "we re-ran the backtest" becomes a real,
# checkable claim rather than something asserted from a local machine whose
# state nobody else can reproduce.
#
# Deliberately NOT scheduled and NOT triggered by push/PR: a full run loads
# six seasons of play-by-play and takes many minutes, so it runs only when
# someone asks for it.
#
# Deliberately does NOT commit its output. results/nfl/backtest_metrics.csv and
# the qb_shrink_k CSVs feed decisions about canonical numbers (the drift
# check's baseline is the committed data/nfl/drift_baseline.json, Stage 33's R4,
# with accuracy printed from data/nfl/calibration.json; both move only on a
# deliberate re-run). Auto-committing would let a routine
# run silently redefine the baseline that drift monitoring compares against.
# Output is uploaded as a build artifact instead; promoting any of it into
# the repo is a separate, deliberate commit by a human.

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Which script to run'
        required: true
        default: 'backtest'
        type: choice
        options:
          - backtest
          - tune_qb_shrink_k
          - check_drift
          - reproducibility_audit
      notes:
        description: 'Why this run? (recorded in the run summary)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    # Six seasons of play-by-play plus a weekly-refit walk-forward is slow;
    # the grid search in tune_qb_shrink_k is slower still. Generous ceiling
    # so a legitimate long run isn't killed, but not unbounded.
    timeout-minutes: 120

    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Record run context
        env:
          # Free text, so it reaches the shell as a variable, never as code
          # (Stage 68 item 30).
          NOTES: ${{ inputs.notes }}
        run: |
          {
            echo "### Run context"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| script | \`${{ inputs.script }}\` |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| requested by | @${{ github.actor }} |"
            echo "| notes | ${NOTES:-_none given_} |"
            echo ""
            echo "Config values this run used:"
            echo ""
            echo '```'
            grep -E '^[A-Z_]+ *=' src/sports/nfl/config.py
            echo '```'
            echo ""
            echo "<details><summary>Installed package versions</summary>"
            echo ""
            echo '```'
            pip freeze
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run ${{ inputs.script }}
        id: run
        run: |
          mkdir -p results/nfl
          set -o pipefail
          case "${{ inputs.script }}" in
            check_drift) package=sports.nfl ;;
            *) package=sports.nfl.research ;;
          esac
          python -m "src.$package.${{ inputs.script }}" 2>&1 | tee "results/nfl/${{ inputs.script }}_run.log"

      - name: Add output to run summary
        # Runs even on failure so a crashed run still shows its tail in the
        # summary instead of forcing a dig through raw logs.
        if: always()
        run: |
          {
            echo ""
            echo "### Output (tail)"
            echo ""
            echo '```'
            tail -n 60 "results/nfl/${{ inputs.script }}_run.log" 2>/dev/null || echo "(no log produced)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.script }}-results-${{ github.run_number }}
          path: |
            results/nfl/*.csv
            results/nfl/*.log
            results/nfl/*.json
          if-no-files-found: warn
          retention-days: 90
