name: NHL daily run

# Stage 58's daily run (src/sports/nhl/daily.py), twice a day: it adds the
# season's finished box scores, saves a pick for every game the lock rule
# (src/sports/nhl/lock.py) says to save now, grades final games and runs the
# drift check. A pick file is written once and never rewritten.
#
# 14:00 and 21:00 UTC are the runs the lock rule was registered with (#299),
# and its hour of slack covers a late start. GitHub's scheduler can start a
# run later than that; a game that has already started by then is reported
# as missed, never saved late, and raises an alert (Stage 68 item 3). workflow_dispatch lets cron-job.org start it
# on the minute, as it does the NFL's runs (Stage 42).
#
# It commits only the NHL's own folders (src/core/isolation.py holds that).
# Its commits are made with GITHUB_TOKEN, so they do not start the Pages
# deploy by themselves; deploy-pages.yml names this workflow in its
# workflow_run list, which does.
#
# On a failure, or a drift flag, src/core/alerts.py opens or comments on an
# issue whose title starts "NHL: ".
on:
  schedule:
    - cron: '0 14 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: nhl-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      # Stage 42 item 1: how late this run started, against its own cron lines.
      - name: Record the start delay
        timeout-minutes: 25
        env:
          # Which cron line fired, so a late copy of one slot is not measured
          # against the next (Stage 68 item 3). Empty on a dispatch.
          CRON_SCHEDULE: ${{ github.event.schedule }}
        run: python -m src.core.start_delay .github/workflows/nhl-daily.yml

      # Stage 42 item 4: a run GitHub's cron started, for a slot cron-job.org
      # should have started, asks whether it did, and opens an issue if not.
      - name: Did cron-job.org start this slot?
        timeout-minutes: 25
        if: github.event_name == 'schedule'
        env:
          CRON_SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
        run: python -m src.core.missed_dispatch .github/workflows/nhl-daily.yml

      - name: Install dependencies
        timeout-minutes: 25
        run: pip install -r requirements.txt

      # `shell: bash` is not decoration: only an explicit bash shell runs with
      # pipefail, and without it `tee` reports success for a run that crashed,
      # the partial state is committed and the failure alert never fires
      # (Stage 68 item 1, the 2026-10-09 audit).
      - name: Run the NHL's daily run
        timeout-minutes: 25
        shell: bash
        run: python -m src.sports.nhl.daily 2>&1 | tee nhl-daily.log

      - name: Pull before committing
        # A fetch and a rebase: minutes at most, so a hung remote fails here, not at the job's limit.
        timeout-minutes: 5
        run: |
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              pull --rebase --autostash origin main
          python -m src.core.pull_check

      - name: Commit the NHL's picks, grades and history
        # Runs python since #628 (src.core.picks_only_grow), so it times out on its own.
        timeout-minutes: 10
        run: |
          # Staging a path that does not exist is an error, and
          # predictions/nhl does not exist until the first pick is saved (the
          # first hand run, 2026-10-06, failed here). So each folder is
          # staged only if it is there.
          test -d data/nhl && git add data/nhl
          test -d predictions/nhl && git add predictions/nhl
          test -d results/nhl && git add results/nhl
          # Stage 93 item 21: a saved pick is never rewritten or removed; a
          # commit that would do either fails here, before it is made.
          python -m src.core.picks_only_grow predictions/nhl
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "NHL daily run"
          # Six workflows push to main, and a push refused as non-fast-forward
          # used to end the run with this slate's picks unsaved (Stage 68
          # item 2, the 2026-10-09 audit). Rebase and retry, three tries in
          # all; a final refusal fails the step, so the picks are kept as an
          # artifact below and the failure alert fires.
          for try in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push refused (try $try of 3); rebasing on main"
            sleep $((try * 15))
            git -c user.name='github-actions[bot]' \
                  -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                  pull --rebase origin main
          done
          echo "push refused three times"
          exit 1

      # The picks a failed run made are written once and never again, so a
      # run that could not push them keeps them here for a hand commit.
      - name: Keep the NHL's picks when the run failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nhl-daily-${{ github.run_id }}
          path: |
            predictions/nhl
            results/nhl
            data/nhl
          if-no-files-found: ignore
          retention-days: 14

      - name: Raise an alert on a drift flag
        timeout-minutes: 25
        if: success()
        # Stage 93 item 12: an alert GitHub refuses after three tries fails
        # this step (summary and annotation) but must not skip the alerts after it.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if grep -q 'DRIFT CHECK: FLAGGED' nhl-daily.log; then
            printf 'The NHL drift check flagged: Model A log loss is significantly above its backtest.\n\nRun: %s\n' \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > drift.md
            python -m src.core.alerts --title "NHL: drift check flagged" --body-file drift.md
          fi

      # Stage 83 item 4 (the 2026-11-02 review): an input the run could not read
      # (injuries, odds, a roster) used to be one printed line in a green run, so
      # picks were saved without it and nobody heard. Each such line starts
      # DEGRADED:, and any of them raises one issue, commented on by later runs.
      - name: Raise an alert on an input the run could not read
        timeout-minutes: 25
        if: success()
        # Stage 93 item 12: an alert GitHub refuses after three tries fails
        # this step (summary and annotation) but must not skip the alerts after it.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if grep -q '^DEGRADED:' nhl-daily.log; then
            { grep '^DEGRADED:' nhl-daily.log
              printf '\nThe picks above were saved without these inputs, and each pick says so. A saved pick is never redone.\n\nRun: %s\n' \
                "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            } > degraded.md
            python -m src.core.alerts --title "NHL: the daily run could not read an input" --body-file degraded.md
          fi

      - name: Raise an alert on a missed pick
        timeout-minutes: 25
        if: success()
        # Stage 93 item 12: an alert GitHub refuses after three tries fails
        # this step (summary and annotation) but must not skip the alerts after it.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if grep -q '^MISSED PICKS:' nhl-daily.log; then
            { grep '^MISSED PICKS:' nhl-daily.log
              printf '\nA pick is saved once, before its game, so these cannot be made now.\n\nRun: %s\n' \
                "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            } > missed.md
            python -m src.core.alerts --title "NHL: a game started with no saved pick" --body-file missed.md
          fi

      # Stage 83 item 1: a run that succeeds closes the failure issue below, if
      # one is open. continue-on-error: closing an issue must never fail a run.
      - name: Close the alert if this run recovered
        timeout-minutes: 25
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf 'Recovered: the run at %s succeeded.\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > recovered.md
          python -m src.core.alerts --resolve --title "NHL: daily run failed" --body-file recovered.md

      - name: Raise an alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Stage 93 item 16 (audit 7, R18): the alert names the artifact that holds the
          # picks the run made, and when a person may commit them.
          { printf 'The NHL daily run failed. See %s\n\n' \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            printf 'Any picks it saved are in the artifact %s on that run (predictions/nhl, results/nhl and data/nhl). ' "nhl-daily-$GITHUB_RUN_ID"
            printf 'Commit them only before the first of their games starts, never after: a pick on main after its start is not a prediction. '
            printf 'Past that, leave them out; the next run marks the games missed.\n'
          } > failure.md
          python -m src.core.alerts --title "NHL: daily run failed" --body-file failure.md --log nhl-daily.log

  # Stage 44 item 2, Line Judge: after a run that went green, does main hold
  # what a right daily run leaves? Every pick committed before its game
  # started (git's time), every final game graded and graded right from its
  # score, the schedule file written today, the run on time
  # (src/core/day_line_judge.py). A finding fails this job and opens or
  # comments on its own issue.
  line-judge:
    needs: [daily]
    if: ${{ needs.daily.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The finding, for the diagnosis job below.
    outputs:
      report: ${{ steps.judge.outputs.report }}
    steps:
      # The whole history, from main as the run left it: when each pick file
      # was first committed is read from git, and a shallow clone shows every
      # file added at once.
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Judge the run
        id: judge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          started=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          if python -m src.core.day_line_judge --sport nhl --run-event "$GITHUB_EVENT_NAME" \
              --run-started "$started" --report line-judge.md; then
            cat line-judge.md >> "$GITHUB_STEP_SUMMARY"
          else
            cat line-judge.md >> "$GITHUB_STEP_SUMMARY"
            echo >> line-judge.md
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> line-judge.md
            python -m src.core.alerts --title "NHL: Line Judge found the daily run left something wrong" \
              --body-file line-judge.md
            delim="LJ_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
            { echo "report<<$delim"; cat line-judge.md; echo "$delim"; } >> "$GITHUB_OUTPUT"
            exit 1
          fi

  # Stage 44 PR 3: only when a check found something, an agent reads the
  # finding against the run's logs and comments what most likely happened on
  # the same alert (.github/workflows/line-judge-diagnose.yml).
  diagnose:
    needs: [line-judge]
    if: ${{ failure() && needs.line-judge.result == 'failure' }}
    permissions:
      contents: read
      actions: read
      issues: write
    uses: ./.github/workflows/line-judge-diagnose.yml
    with:
      report: ${{ needs.line-judge.outputs.report }}
      title: "NHL: Line Judge found the daily run left something wrong"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
