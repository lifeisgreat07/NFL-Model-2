name: Releases

# Stage 41 item 3 (Mark, 2026-10-04): a GitHub Release for every model
# version, its title and notes taken from config.VERSION_HISTORY by
# src/agents/release_notes.py, the same entries What's Changed shows. A
# version that already has a release is skipped, so running it again
# changes nothing.
#
# Since Stage 49 item 25 (2026-10-05) a pushed version tag starts it too, so
# a new MODEL_VERSION releases itself when its tag is pushed. Tags only:
# never a branch push. A pushed tag that is not a version in the history
# fails the run instead of releasing nothing in silence. By hand still works.
on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  releases:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: A pushed tag must name a version in the history
        if: github.event_name == 'push'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! python -m src.agents.release_notes --list | grep -qx "${TAG#v}"; then
            echo "::error::$TAG is not a version in config.VERSION_HISTORY; add its entry, then run this by hand"
            exit 1
          fi

      - name: Create the releases that do not exist yet
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for v in $(python -m src.agents.release_notes --list); do
            if gh release view "v$v" >/dev/null 2>&1; then
              echo "v$v: already released"
              continue
            fi
            python -m src.agents.release_notes --version "$v" > notes.md
            gh release create "v$v" --verify-tag --title "$(python -m src.agents.release_notes --version "$v" --title)" --notes-file notes.md
            echo "v$v: released"
          done
