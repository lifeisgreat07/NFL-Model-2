name: Releases

# Stage 41 item 3 (Mark, 2026-10-04): a GitHub Release for every model
# version, its title and notes taken from config.VERSION_HISTORY by
# src/agents/release_notes.py, the same entries What's Changed shows. Run by
# hand after a new MODEL_VERSION is tagged. A version that already has a
# release is skipped, so running it again changes nothing.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  releases:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Create the releases that do not exist yet
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for v in $(python -m src.agents.release_notes --list); do
            if gh release view "v$v" >/dev/null 2>&1; then
              echo "v$v: already released"
              continue
            fi
            python -m src.agents.release_notes --version "$v" > notes.md
            gh release create "v$v" --verify-tag --title "$(python -m src.agents.release_notes --version "$v" --title)" --notes-file notes.md
            echo "v$v: released"
          done
