name: Spotter renders

# Stage 43 item 2. The render half of Spotter (decision record 0007): for a
# pull request that changes what a page is built from, build the site from
# the pull request's head and from its base, and take a picture of each page
# the change touches at 390x844 and 1440x900 in the light and the dark theme.
# The pictures are uploaded as one artifact for the reading job (item 3).
#
# This job holds no model and `contents: read` only. It does run the pull
# request's own code (it builds the site from it), which is why it can write
# nothing: the pictures leave it as an artifact, and the job that publishes
# them (item 3) is a different job that runs no repository code.
# tests/test_spotter_permissions.py holds that rule over this file.
#
# Which pages: src/agents/spotter_pages.py maps the changed files to the
# pages they feed, and a page file it does not know renders every page.
# How: tests/browser/spotter_render.py, with a fixed clock, UTC, the network
# blocked and two named viewports, so the head's picture and the base's of
# the same page differ only by the change. No pixel is compared.
#
# Not run for a fork: its code would run here with this repository's runner,
# as Booth's dispatch refuses (Stage 68 item 7).

on:
  pull_request:
    paths:
      - 'src/dashboard/**'
      - 'src/site/**'
      - 'src/sports/nhl/pages/**'
      - 'src/sports/nhl/site.py'
      - 'src/sports/nhl/page_inputs.py'
      - 'src/sports/nba/pages/**'
      - 'src/sports/nba/site.py'
      - 'src/sports/nba/page_inputs.py'
      - 'src/agents/spotter_pages.py'
      - 'assets/**'
      - 'tests/browser/spotter_render.py'
      - '.github/workflows/spotter.yml'

permissions:
  contents: read

# A new push supersedes the render in flight.
concurrency:
  group: spotter-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TZ: UTC
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      # The pull request's head and its base, each in its own folder, by SHA:
      # not the merge ref, which is neither of the two pages being compared.
      - name: Check out the head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: head

      - name: Check out the base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Pick the pages this change touches
        id: pages
        working-directory: head
        run: |
          pages=$(python -m src.agents.spotter_pages --base "$BASE_SHA" --head "$HEAD_SHA")
          echo "pages=$pages" >> "$GITHUB_OUTPUT"
          echo "Pages to render: ${pages:-none}" >> "$GITHUB_STEP_SUMMARY"

      # Versions pinned as the browser checks pin them: a browser that changes
      # under the renderer would change what a picture shows without anyone
      # deciding it should.
      - name: Install dependencies
        if: steps.pages.outputs.pages != ''
        run: |
          pip install -r head/requirements.txt
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Build the head's site
        if: steps.pages.outputs.pages != ''
        working-directory: head
        run: python -m src.site.build --out "$RUNNER_TEMP/site-head"

      - name: Build the base's site
        if: steps.pages.outputs.pages != ''
        working-directory: base
        run: python -m src.site.build --out "$RUNNER_TEMP/site-base"

      # One instant for both renders: the head commit's own time, so a page
      # that reads "today" shows the same day in the head's picture and the
      # base's.
      - name: Take the pictures
        if: steps.pages.outputs.pages != ''
        env:
          PAGES: ${{ steps.pages.outputs.pages }}
        run: |
          clock=$(date -u -d "$(git -C head show -s --format=%cI "$HEAD_SHA")" +%Y-%m-%dT%H:%M:%SZ)
          for label in head base; do
            python head/tests/browser/spotter_render.py --site "$RUNNER_TEMP/site-$label" \
              --pages "$PAGES" --label "$label" --out "$RUNNER_TEMP/renders" --clock "$clock"
          done
          ls -l "$RUNNER_TEMP/renders" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the pictures
        if: steps.pages.outputs.pages != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spotter-renders-pr${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/renders
          retention-days: 14
          if-no-files-found: error
