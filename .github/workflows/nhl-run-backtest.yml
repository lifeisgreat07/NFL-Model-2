name: NHL run backtest

# Re-runs the NHL's registered backtest (experiments/nhl/stage56/registry.json)
# from the committed box scores and market file, and says whether the results
# match the committed ones (Stage 68 item 28, the 2026-10-09 audit's E27).
# The comparison allows float noise in the last digits and nothing more.
# Until this existed, the tuning and confirmation files had been written once,
# on one machine, and nothing re-ran them where anyone else could see.
#
# On demand only. Like the NFL's run backtest, it commits nothing: a re-run
# that differs is uploaded as an artifact and fails, and promoting it into the
# repo is a separate, deliberate commit by a human, because the drift check's
# baseline and the page's numbers are read from these files.

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Why this run? (recorded in the run summary)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Keep the committed results
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/committed"
          cp experiments/nhl/stage56/results/*.json "$RUNNER_TEMP/committed/"

      - name: Re-run the backtest
        shell: bash
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          {
            echo "### NHL backtest re-run"
            echo ""
            echo "commit \`$GITHUB_SHA\`, requested by @$GITHUB_ACTOR; notes: ${NOTES:-none given}"
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p results/nhl
          python -m src.sports.nhl.backtest 2>&1 | tee results/nhl/backtest_rerun.log

      # A float may move in its last digits on another machine (the sums run
      # in another order); src/core/compare_results.py allows a relative 1e-9
      # and nothing else. A difference fails the run, and the new files are in
      # its artifact.
      - name: Compare with the committed results
        shell: bash
        run: |
          python -m src.core.compare_results "$RUNNER_TEMP/committed" experiments/nhl/stage56/results \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the re-run
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nhl-backtest-${{ github.run_number }}
          path: |
            experiments/nhl/stage56/results/*.json
            results/nhl/backtest_rerun.log
          if-no-files-found: warn
          retention-days: 90
