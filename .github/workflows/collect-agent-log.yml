name: Collect Booth's audit log

# Turns Booth's audit comments into data/agent_log.json, which the dashboard
# renders. Until this existed the collector had never run: src/agents/collect_agent_log.py
# was committed and tested, data/agent_log.json had never been written, and the
# page that was supposed to show this work was three hand-written incidents.
#
# It runs HERE rather than locally for one practical reason: the audits live in
# GitHub comments, and a token to read them already exists in Actions. Pulling
# nineteen PRs of Booth reports down to a laptop to parse them is the same job
# done in the more expensive place.
#
# Writing data/agent_log.json pushes to main under data/nfl/**, which is one of the
# paths Auto-regenerate dashboard watches -- so the page updates itself from
# here without this workflow knowing anything about index.html.
# Triggered when a pull request into main is closed, and run only if it was
# merged (Stage 34 item 28, Mark's call on 2026-09-29). It used to run on every
# push to main, so every push after a new Booth comment -- a weekly data
# commit, a docs commit -- produced one more bot commit: about 280 of the
# repository's first ~1,130 commits were this workflow's. An audit belongs to a
# pull request, so the pull request's merge is the moment to record it. Manual
# dispatch stays for a catch-up run.
#
# `pull_request`, NOT `pull_request_target`. pull_request_target runs with the
# base repository's permissions and can be started from a fork; combined with
# `contents: write` on a public repo that is the pwn-request shape, one careless
# "check out the PR head" away from letting a stranger's code run with a write
# token. Under `pull_request` a fork's run gets a read-only token, and the job
# below checks out main, never the pull request's head.
#
# It cannot retrigger itself: its own commit is a push, and push is not a
# trigger here any more. (GitHub also starts no run from a push made with the
# default GITHUB_TOKEN; this no longer depends on that.)
on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]

# Read the comments, write the one data file. Nothing else.
permissions:
  contents: write
  pull-requests: read
  issues: read
  actions: read

concurrency:
  group: collect-agent-log
  cancel-in-progress: false

jobs:
  collect:
    # A closed pull request that was not merged has nothing to record.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Fetch every issue comment in the repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # One endpoint covers it: PR conversation comments ARE issue comments.
        # --paginate because the audits already run to several pages, and a
        # silently truncated first page would understate the record rather
        # than fail -- the failure mode this log exists to avoid.
        # user.login is kept because the collector counts a comment only if
        # Booth's own account posted it (Stage 23); without it, nothing counts.
        run: |
          gh api --paginate \
            "/repos/${{ github.repository }}/issues/comments?per_page=100" \
            --jq '[.[] | {body, html_url, created_at, user: {login: .user.login}}]' \
            | python -c "import json,sys; pages=[json.loads(l) for l in sys.stdin if l.strip()]; json.dump([c for p in pages for c in p], open('comments.json','w'))"
          python -c "import json; print('fetched', len(json.load(open('comments.json'))), 'comments')"

      # Stage 90 item 3: Scout writes to its run, not to a comment, so its
      # recent runs are read too, for the page's list of the agents at work.
      - name: Fetch Scout's recent runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "/repos/${{ github.repository }}/actions/workflows/scout-preflight.yml/runs?per_page=30" \
            --jq '[.workflow_runs[] | {conclusion, html_url, created_at, pull_requests: [.pull_requests[] | {number}]}]' > scout.json

      - name: Build data/agent_log.json
        run: python -m src.agents.collect_agent_log --comments comments.json --scout scout.json

      - name: Show what was collected
        run: python -c "import json; d=json.load(open('data/agent_log.json')); print(json.dumps(d.get('summary', {}), indent=2))"

      - name: Remove the raw comment dump
        run: rm -f comments.json scout.json

      # Catch up with main before committing, as the Weekly update and the
      # Weekend refresh do (issue #145). This job checks out main at the merge
      # and fetches every comment, which takes long enough for a scheduled
      # data push to land in between; the push below would then be refused as
      # non-fast-forward and stay red until the next merge (the third audit,
      # 2026-09-30). --autostash carries the uncommitted agent_log.json across
      # the rebase, and stashing makes a commit, hence the identity.
      - name: Catch up with main
        shell: bash
        run: |
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              pull --rebase --autostash origin main
          python -m src.core.pull_check

      - name: Commit the log if it changed
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "Collect Booth's audit log"
          file_pattern: 'data/agent_log.json'
          # Required on a pull_request run: the action's default branch is
          # github.head_ref, the pull request's own branch, which the merge
          # script has already deleted. The first run after #232 failed here.
          branch: main
