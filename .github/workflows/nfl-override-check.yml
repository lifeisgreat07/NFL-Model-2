name: NFL QB override check

# Stage 88 item 4 (the 2026-11-02 review). A QB override is a claim about who
# plays, and the lock predicts on it. load_qb_overrides refuses one with no
# link or no valid player id; this checks the rest on the pull request that
# adds it, before it can be merged: the player is a quarterback on the team's
# current nflverse roster, and the source is a team site or a listed outlet
# (data/nfl/qb_override_sources.json). src/sports/nfl/override_check.py; the
# lock makes the same check and does not use an override that fails it.
#
# The code that runs is the BASE commit's, never the pull request's: the
# pull request's override files are fetched from the API as data, and a
# pull request cannot rewrite the check that judges it.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'data/nfl/qb_overrides/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the base commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        timeout-minutes: 5
        run: pip install -r requirements.txt

      - name: Check each override file the pull request adds or changes
        timeout-minutes: 5
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/overrides"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
            --jq '.[] | select(.status != "removed") | .filename' \
            | grep -E '^data/nfl/qb_overrides/[0-9]{4}_week[0-9]+\.json$' > "$RUNNER_TEMP/files.txt" || true
          if [ ! -s "$RUNNER_TEMP/files.txt" ]; then
            echo "No override file added or changed."
            exit 0
          fi
          while read -r path; do
            gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$HEAD_SHA" \
              -H 'Accept: application/vnd.github.raw' > "$RUNNER_TEMP/overrides/$(basename "$path")"
          done < "$RUNNER_TEMP/files.txt"
          python -m src.sports.nfl.override_check "$RUNNER_TEMP"/overrides/*.json | tee -a "$GITHUB_STEP_SUMMARY"
