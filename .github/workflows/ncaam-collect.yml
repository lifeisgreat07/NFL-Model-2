name: NCAAM results collector

# Stage 103 item 1: men's college basketball's finished games, collected
# through the season for the March Madness bracket's ratings
# (src/sports/ncaam/collector.py). Once a day it reads ESPN's Division I
# scoreboard for the last three days (Eastern) and adds every final game not
# stored yet to data/ncaam/history/games_<season>.csv, with when it was read.
# A stored row is never rewritten. No pick is made and nothing is published.
#
# The three-day window lets a run that started late, or failed, be caught up
# by the next one, so GitHub's own scheduler is enough: nothing here locks.
#
# It commits only the NCAAM's own folder (src/core/isolation.py holds that).
# On a failure, src/core/alerts.py opens or comments on an issue whose title
# starts "NCAAM: ".
on:
  schedule:
    - cron: '23 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: ncaam-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      # Stage 42 item 1: how late this run started, against its own cron line.
      - name: Record the start delay
        timeout-minutes: 10
        run: python -m src.core.start_delay .github/workflows/ncaam-collect.yml

      - name: Install dependencies
        timeout-minutes: 10
        run: pip install --require-hashes -r requirements.lock

      # `shell: bash` runs with pipefail, so a crash is not reported as success by `tee`.
      - name: Collect the last three days' results
        timeout-minutes: 10
        shell: bash
        run: python -m src.sports.ncaam.collector 2>&1 | tee ncaam-collect.log

      - name: Pull before committing
        timeout-minutes: 5
        run: |
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              pull --rebase --autostash origin main
          python -m src.core.pull_check

      - name: Commit the collected results
        timeout-minutes: 5
        run: |
          test -d data/ncaam && git add data/ncaam
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "NCAAM results"
          for try in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push refused (try $try of 3); rebasing on main"
            sleep $((try * 15))
            git -c user.name='github-actions[bot]' \
                  -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                  pull --rebase origin main
          done
          echo "push refused three times"
          exit 1

      - name: Close the alert if this run recovered
        timeout-minutes: 10
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf 'Recovered: the run at %s succeeded.\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > recovered.md
          python -m src.core.alerts --resolve --title "NCAAM: the results collector failed" --body-file recovered.md

      - name: Raise an alert on failure
        if: failure()
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          printf 'The NCAAM results collector failed.\n\nRun: %s\n' "$run_url" > alert.md
          python -m src.core.alerts --title "NCAAM: the results collector failed" --body-file alert.md
