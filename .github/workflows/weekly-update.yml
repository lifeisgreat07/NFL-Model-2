name: Weekly update

# Runs the actual weekly pipeline unattended during the season: generates
# next week's predictions (on the run that locks them -- see Schedule), grades
# any completed weeks, and regenerates the dashboard. This is the
# scheduled trigger the project was designed around from the start (see
# README's "Automating this with Claude Code Routines" section) but never
# had -- without it, nothing runs unless someone does it by hand.
#
# Schedule: twice a week.
#   Tuesday 11:00 UTC -- after Monday Night Football is final. Grades the
#     week, refreshes ratings and the line archive. It locks next week only
#     if a game comes too early for Thursday (Thanksgiving, a Wednesday game).
#   Thursday 16:00 UTC (noon ET in EDT, 11 AM in EST) -- locks the week
#     before Thursday night's kickoff, after Wednesday's injury reports, so
#     a QB override written by then is used. Decided by Mark 2026-09-22.
# Which run locks is decided in src/weekly_update.py (decide_lock), from
# SCHEDULED_RUNS_UTC. That constant must match these two lines, and
# tests/test_pick_lock_time.py checks that it does.
on:
  schedule:
    - cron: '0 11 * * 2'
    - cron: '0 16 * * 4'
  workflow_dispatch: {}

permissions:
  contents: write
  # For the alert step at the end, which opens an issue when the run fails.
  # For src/drift_alert.py, which opens an issue when the drift check flags.
  issues: write

jobs:
  weekly-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine current NFL season
        id: season
        run: |
          year=$(date -u +%Y)
          month=$(date -u +%m)
          # Jan/Feb still belong to the season that kicked off the
          # previous calendar year (playoffs/Super Bowl).
          if [ "$month" -le 2 ]; then
            year=$((year - 1))
          fi
          echo "season=$year" >> "$GITHUB_OUTPUT"

      # The log is kept for the run summary below. `shell: bash` is not
      # decoration: only an explicit bash shell runs with pipefail, and without
      # it `tee` would report success for a run that failed on purpose.
      - name: Generate/lock in this week's predictions
        shell: bash
        run: python src/weekly_update.py --season ${{ steps.season.outputs.season }} 2>&1 | tee weekly-update.log

      # `!cancelled()` on this step and the commit: the step above fails the
      # job on purpose when a whole week kicked off with nothing locked, and
      # that must not also stop last week's grades from landing.
      - name: Grade any completed weeks
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          for f in predictions/*_week*.json; do
            fname=$(basename "$f")
            if [[ "$fname" =~ ^([0-9]+)_week([0-9]+)\.json$ ]]; then
              season="${BASH_REMATCH[1]}"
              week="${BASH_REMATCH[2]}"
              echo "Grading $season week $week..."
              python src/grade_predictions.py --season "$season" --week "$week"
            fi
          done

      # After grading, so it sees this week's results. An issue when the drift
      # check flags; never a failed run, because drift is a question for a
      # person and stopping the run would cost picks. drift-report.txt is not
      # committed: the commit below takes predictions/, results/ and data/ only.
      - name: Check for model drift
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python src/drift_alert.py --report drift-report.txt

      # Before the commit, because it reads `git status` to see which
      # prediction and result files this run wrote. Goes on the run's page;
      # weekly-summary.md also feeds the alert below. Neither file is committed.
      - name: Summarise the run
        if: ${{ !cancelled() }}
        run: |
          python src/weekly_summary.py --season ${{ steps.season.outputs.season }} \
            --log weekly-update.log --drift drift-report.txt \
            --out weekly-summary.md >> "$GITHUB_STEP_SUMMARY"

      # This workflow no longer builds or commits the dashboard. It commits the
      # DATA it produces, and "Deploy dashboard to Pages" turns that into the
      # published page.
      #
      # It does NOT reach the builder through the path set. This comment said
      # it did until 2026-09-15 -- that `data/**`, `predictions/**` and
      # `results/**` are "exactly the path set Deploy dashboard to Pages
      # watches, so the page is rebuilt". They are that path set, and the page
      # was not rebuilt: the push below is made with the default GITHUB_TOKEN,
      # and GitHub will not let such a push trigger another workflow. The
      # builder reaches this run through a workflow_run trigger naming
      # "Weekly update", which is the `name:` at the top of this file -- rename
      # it and the handoff breaks silently, with no run and no error.
      #
      # Read that as the general warning it is: this is the second time the
      # GITHUB_TOKEN rule has been written down as a safeguard by a workflow it
      # was quietly severing.
      #
      # Two steps were removed here in Stage 8c phase 2 -- a `generate_dashboard.py`
      # run whose output nobody would have committed, and the churn pruner that
      # existed only to stop the commit below from committing a build stamp.
      # Untracking the artifacts removed the problem the pruner solved, so the
      # pruner was deleted rather than left as a step that always does nothing.
      - name: Commit and push changes
        if: ${{ !cancelled() }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Weekly update: predictions and grading"
          file_pattern: 'predictions/** results/** data/**'

      # Last, so it sees a failure in any step above, the commit included. A
      # failed Thursday run leaves that night's game unpicked unless someone
      # dispatches the workflow by hand the same day, so it has to reach Mark
      # while there is still time. One issue, commented on by later failures.
      - name: Raise an alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            if [ -s weekly-summary.md ]; then cat weekly-summary.md; else echo "The run failed before it could be summarised."; fi
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Last lines of the log:"
            echo '```'
            tail -n 30 weekly-update.log 2>/dev/null || echo "(no log)"
            echo '```'
          } > alert-body.md
          python src/alerts.py --title "Weekly update failed" --body-file alert-body.md
